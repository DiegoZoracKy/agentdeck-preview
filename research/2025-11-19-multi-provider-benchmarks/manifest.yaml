schema_version: 1
experiment_id: 2025-11-19-multi-provider-benchmarks
title: Multi-Provider Benchmarks
status: running
question: How do Gemini variants compare to GPT-4o-mini in strategic gameplay?
game:
  name: FixedDamageGame
  config: {}
players:
  - id: A
    provider: openai
    model: gpt-4o-mini
  - id: B
    provider: google
    model: mixed
variants:
  models:
    - gemini-2.5-flash
    - gemini-2.5-pro
    - gpt-4o-mini
  controllers:
    - ReasoningController
run:
  seed_base: 42
  matches_planned: 100
  matches_completed: 93
  concurrency: 10
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
notes: Results reflect recordings present in this repo; full narrative lives in logs/.
