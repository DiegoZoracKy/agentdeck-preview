schema_version: 1
experiment_id: 2026-03-24-variable-damage-reinforcement-1
created_at: "2026-03-24T00:00:00Z"
purpose: >-
  VariableDamage turn-reinforcement pilot testing whether repeated controller
  instructions on top of Flash-Lite reasoning stabilize the repaired
  risk-band policy enough to perform better against plain Flash.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_variable_reinforced_turns
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first public VariableDamage reinforcement writeup if required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gemini_2_5_flash:
    kind: llm
    provider: google
    model: gemini-2.5-flash
    tier: weak
    max_retries: 12
    retry_delay: 4.0
    generation_config:
      thinking_config:
        thinking_budget: 0

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_turn_reinforced:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}\n\n{controller_format}"

sampling_policy:
  pilot_matches_per_cell: 24
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 12
    side_swap_required: true
  expansion_selection_rules:
    - reinforcement_reduces_safe_zone_overhealing_without_reopening_underhealing
    - reinforcement_reduces_risk_band_policy_delta
    - reinforcement_improves_second_player_conversion_against_flash

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package isolates turn reinforcement on top of Flash-Lite RC in
      VariableDamage. Read the control and treatment together, with special
      attention to the new safe-zone, lower-danger, upper-danger, scarcity,
      and first-lethal-entry behavioral metrics.
    matches_per_cell: 0
    required_checks:
      - variable_damage_reinforcement_scope_review
      - flash_lite_controller_followup_review
      - paired_side_swap_review
      - risk_band_metric_review
      - new_safe_zone_and_scarcity_metric_review
  phases:
    - phase_id: P1
      name: Reinforcement Pilot
      cell_ids:
        - p1_c01_flash_lite_rc_vs_flash_ao
        - p1_c02_flash_lite_rc_tr_vs_flash_ao

cells:
  - id: p1_c01_flash_lite_rc_vs_flash_ao
    phase: P1
    question: How far does Flash-Lite reasoning alone go against plain Flash in VariableDamage on a fresh seed family?
    intent: Refresh the Flash-Lite RC control arm inside the same package before testing reinforcement.
    causal_factor: strategy_stack
    fairness_notes: paired side-swap enabled; compare risk-band and seat-controlled behavior before topline claims
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: RC_handshake_only
      name: FlashLite-RC
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 24
    pilot_matches: 24
    expansion_target_matches: 48
    viewer_priority: true

  - id: p1_c02_flash_lite_rc_tr_vs_flash_ao
    phase: P1
    question: Does turn reinforcement stabilize Flash-Lite reasoning enough to outperform the handshake-only RC policy against plain Flash?
    intent: Test whether repeated controller instructions reduce the new VariableDamage policy variance without breaking the RC repair.
    causal_factor: instruction_reinforcement
    fairness_notes: paired side-swap enabled; compare safe-zone, danger-subband, scarcity, and first-lethal-entry behavior before topline claims
    seed_offset: 100
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: RC_turn_reinforced
      name: FlashLite-RC-TR
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 24
    pilot_matches: 24
    expansion_target_matches: 48
    viewer_priority: true
