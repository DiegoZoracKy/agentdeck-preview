schema_version: 1
experiment_id: 2026-03-24-variable-damage-reinforcement-1
title: VariableDamage Reinforcement 1
status: complete
question: >-
  Does turn-time instruction reinforcement on top of ReasoningController
  stabilize Flash-Lite's improved VariableDamage policy enough to close more
  ground against plain Flash?
game:
  name: VariableDamageGame
  config:
    max_health: 100
    min_attack_damage: 15
    max_attack_damage: 25
    potion_heal: 30
    starting_potions: 3
    information_level: partial
players:
  - id: gemini_2_5_flash_lite_rc
    provider: google
    model: gemini-2.5-flash-lite
    controller: ReasoningController
    renderer: TextRenderer
  - id: gemini_2_5_flash_lite_rc_tr
    provider: google
    model: gemini-2.5-flash-lite
    controller: ReasoningController
    renderer: TextRenderer
  - id: gemini_2_5_flash_ao
    provider: google
    model: gemini-2.5-flash
    controller: ActionOnlyController
    renderer: TextRenderer
variants:
  models:
    - gemini-2.5-flash-lite
    - gemini-2.5-flash
  controllers:
    - ReasoningController
    - ActionOnlyController
  prompt_cadence:
    - handshake_only
    - turn_reinforced
run:
  seed_base: 24242
  matches_planned: 48
  matches_completed: 48
  concurrency: 1
  max_turns: 40
  matrix_source: matrix.yaml
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  matrix_yaml: matrix.yaml
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
storage:
  raw_recordings:
    backend: local
    path: research/2026-03-24-variable-damage-reinforcement-1/agentdeck_runs
  summaries:
    repo_path: research/2026-03-24-variable-damage-reinforcement-1
  viewer_curation:
    repo_path: research/2026-03-24-variable-damage-reinforcement-1/artifacts
notes: >-
  First VariableDamage turn-reinforcement package. It stays on the Flash-Lite
  line after Controller 1 showed a strong RC behavioral repair but introduced
  more policy variance than the plain AO baseline. Completed on 2026-03-24 with
  one transient empty startup session removed from interpretation and several
  recoverable Flash-AO Vertex 429 retries that affected latency only.
