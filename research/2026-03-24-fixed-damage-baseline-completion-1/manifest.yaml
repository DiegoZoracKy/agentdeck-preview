schema_version: 1
experiment_id: 2026-03-24-fixed-damage-baseline-completion-1
title: FixedDamage Baseline Completion 1
status: complete
question: >-
  How do the remaining plain-model FixedDamage matchups among Flash-Lite,
  Flash, Mini, and Haiku resolve head-to-head, and what does that complete
  baseline ordering add to the cross-game comparison against VariableDamage?
game:
  name: FixedDamageGame
  config:
    max_health: 100
    attack_damage: 20
    potion_heal: 30
    starting_potions: 3
    information_level: partial
players:
  - id: gemini_2_5_flash_lite_ao
    provider: google
    model: gemini-2.5-flash-lite
    controller: ActionOnlyController
    renderer: TextRenderer
  - id: gemini_2_5_flash_ao
    provider: google
    model: gemini-2.5-flash
    controller: ActionOnlyController
    renderer: TextRenderer
  - id: gpt_4o_mini_ao
    provider: openai
    model: gpt-4o-mini
    controller: ActionOnlyController
    renderer: TextRenderer
  - id: claude_haiku_4_5_20251001_ao
    provider: anthropic
    model: claude-haiku-4-5-20251001
    controller: ActionOnlyController
    renderer: TextRenderer
variants:
  models:
    - gemini-2.5-flash-lite
    - gemini-2.5-flash
    - gpt-4o-mini
    - claude-haiku-4-5-20251001
  controllers:
    - ActionOnlyController
  prompt_cadence:
    - handshake_only
run:
  seed_base: 26242
  matches_planned: 192
  matches_completed: 192
  concurrency: 1
  max_turns: 30
  matrix_source: matrix.yaml
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  matrix_yaml: matrix.yaml
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
storage:
  raw_recordings:
    backend: local
    path: research/2026-03-24-fixed-damage-baseline-completion-1/agentdeck_runs
  summaries:
    repo_path: research/2026-03-24-fixed-damage-baseline-completion-1
  viewer_curation:
    repo_path: research/2026-03-24-fixed-damage-baseline-completion-1/artifacts
notes: >-
  AO-only FixedDamage baseline completion package. It fills the remaining
  plain-model edges needed to compare the FixedDamage and VariableDamage
  baseline orderings more symmetrically without reopening the FixedDamage
  intervention arc.
