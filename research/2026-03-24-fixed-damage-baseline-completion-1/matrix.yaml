schema_version: 1
experiment_id: 2026-03-24-fixed-damage-baseline-completion-1
created_at: "2026-03-24T00:00:00Z"
purpose: >-
  FixedDamage AO-only baseline completion package filling the remaining
  plain-model matchups among Flash-Lite, Flash, Mini, and Haiku so the
  FixedDamage plain ordering can be compared more symmetrically with the later
  VariableDamage round-robin.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_action_only_turn
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first executed FixedDamage baseline completion batch if required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gemini_2_5_flash:
    kind: llm
    provider: google
    model: gemini-2.5-flash
    tier: weak
    max_retries: 12
    retry_delay: 4.0
    generation_config:
      thinking_config:
        thinking_budget: 0
  gpt_4o_mini:
    kind: llm
    provider: openai
    model: gpt-4o-mini
    tier: weak
  claude_haiku_4_5_20251001:
    kind: llm
    provider: anthropic
    model: claude-haiku-4-5-20251001
    tier: weak

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: true
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"

sampling_policy:
  pilot_matches_per_cell: 48
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 24
    side_swap_required: true
  expansion_selection_rules:
    - missing_fixed_damage_plain_edges_are_filled
    - cross_game_baseline_ordering_becomes_legible
    - no_intervention_branch_is_implied_without_new_failure_evidence

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package is baseline-only. Analysis must complete the missing
      FixedDamage plain-model ordering and compare it against VariableDamage,
      but must not reopen FixedDamage intervention work unless a genuinely new
      and actionable failure mode appears.
    matches_per_cell: 0
    required_checks:
      - fixed_damage_plain_ordering_review
      - cross_provider_position_control_review
      - baseline_completion_scope_review
      - paired_side_swap_review
  phases:
    - phase_id: P1
      name: Plain-Model Completion Round Robin
      cell_ids:
        - p1_c01_flash_lite_ao_vs_haiku_ao
        - p1_c02_flash_ao_vs_mini_ao
        - p1_c03_flash_ao_vs_haiku_ao
        - p1_c04_mini_ao_vs_haiku_ao

cells:
  - id: p1_c01_flash_lite_ao_vs_haiku_ao
    phase: P1
    question: How does plain Flash-Lite compare to plain Haiku in FixedDamage before any controller or prompt-stack intervention?
    intent: Close the missing Haiku-vs-FlashLite baseline edge so the Haiku cross-game comparison is symmetric with VariableDamage.
    causal_factor: baseline_model_policy
    fairness_notes: paired side-swap enabled; analysis must report both raw and position-controlled results, with special attention to Haiku's seat-conditioned policy inversion
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: AO_handshake_only
      name: FlashLite-AO
    player_b:
      player_ref: claude_haiku_4_5_20251001
      config_ref: AO_handshake_only
      name: Haiku-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true

  - id: p1_c02_flash_ao_vs_mini_ao
    phase: P1
    question: How does plain Flash compare to plain Mini in FixedDamage before any controller or prompt-stack intervention?
    intent: Complete the strongest plain-model ladder by measuring whether Mini's early-heal baseline can stand up to plain Flash directly.
    causal_factor: baseline_model_policy
    fairness_notes: paired side-swap enabled; analysis must report both raw and position-controlled results, with special attention to early-heal versus critical-heal tradeoffs
    seed_offset: 100
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    player_b:
      player_ref: gpt_4o_mini
      config_ref: AO_handshake_only
      name: Mini-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true

  - id: p1_c03_flash_ao_vs_haiku_ao
    phase: P1
    question: How does plain Flash compare to plain Haiku in FixedDamage before any controller or prompt-stack intervention?
    intent: Measure whether Haiku's seat-inverted FixedDamage policy still competes with Flash's steadier threshold behavior in a direct head-to-head.
    causal_factor: baseline_model_policy
    fairness_notes: paired side-swap enabled; analysis must report both raw and position-controlled results, with special attention to shared-state action reversals
    seed_offset: 200
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    player_b:
      player_ref: claude_haiku_4_5_20251001
      config_ref: AO_handshake_only
      name: Haiku-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true

  - id: p1_c04_mini_ao_vs_haiku_ao
    phase: P1
    question: How does plain Mini compare to plain Haiku in FixedDamage before any controller or prompt-stack intervention?
    intent: Complete the missing OpenAI-vs-Anthropic baseline edge so the weak-tier FixedDamage ordering is no longer inferred indirectly.
    causal_factor: baseline_model_policy
    fairness_notes: paired side-swap enabled; analysis must report both raw and position-controlled results, with special attention to second-player outcomes and state-level action reversals
    seed_offset: 300
    game:
      information_level: partial
    player_a:
      player_ref: gpt_4o_mini
      config_ref: AO_handshake_only
      name: Mini-AO
    player_b:
      player_ref: claude_haiku_4_5_20251001
      config_ref: AO_handshake_only
      name: Haiku-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true
