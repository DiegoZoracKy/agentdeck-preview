schema_version: 1
experiment_id: 2026-03-20-fixed-damage-mini-parity-1
created_at: "2026-03-20T00:00:00Z"
purpose: >-
  FixedDamage cross-provider parity study testing whether the full
  Flash-Lite strategy stack (ReasoningController + turn reinforcement +
  HP-threshold grounding) can stay competitive against plain GPT-4o Mini on a
  fresh schedule family.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_parity4_turn_modes
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first public release writeup if a frozen repo hash is required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gpt_4o_mini:
    kind: llm
    provider: openai
    model: gpt-4o-mini
    tier: weak

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: true
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_turn_reinforced_hp_grounded:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: true
    prompt_builder:
      turn_template_mode: custom
      turn_template: |-
        {game_view}

        {controller_format}

        Before acting, calculate: does your current HP minus one ATTACK (20 damage) leave you alive? Let that determine your choice.

sampling_policy:
  pilot_matches_per_cell: 48
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 24
    side_swap_required: true
  expansion_selection_rules:
    - flash_lite_stack_remains_behaviorally_coherent_against_mini
    - cross_provider_gap_is_small_enough_to_be_productively_iterated
    - cost_and_behavior_tradeoff_is_explicit

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package opens the cross-provider question. Analysis must report both
      named-player and position-controlled results explicitly and compare the
      behavioral profile of the full Flash-Lite stack against Mini's cleaner
      baseline policy.
    matches_per_cell: 0
    required_checks:
      - parity_question_review
      - hp_grounding_prompt_review
      - cross_provider_position_control_review
      - behavioral_endpoints_review
      - paired_side_swap_review
  phases:
    - phase_id: P1
      name: Cross-Provider Parity Run
      cell_ids:
        - p1_c01_flash_lite_rc_tr_hp_vs_mini_ao

cells:
  - id: p1_c01_flash_lite_rc_tr_hp_vs_mini_ao
    phase: P1
    question: Can the full Flash-Lite strategy stack stay competitive with plain GPT-4o Mini at N=48 in a fresh cross-provider matchup?
    intent: Test whether the Flash-Lite strategy advantages transfer outside the Gemini family against a stable Mini baseline.
    causal_factor: strategy_stack
    fairness_notes: paired side-swap enabled; analysis must report both named-player and position-controlled results, with special attention to second-player wins
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: RC_turn_reinforced_hp_grounded
      name: FlashLite-RC-TR-HP
    player_b:
      player_ref: gpt_4o_mini
      config_ref: AO_handshake_only
      name: Mini-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true
