schema_version: 1
experiment_id: 2026-03-20-fixed-damage-parity-3
created_at: "2026-03-20T00:00:00Z"
purpose: >-
  FixedDamage cross-model parity study testing whether the full Flash-Lite
  strategy stack (ReasoningController + turn reinforcement + HP-threshold
  grounding) can match plain Gemini Flash under the same audited game and
  fairness settings.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_parity3_turn_modes
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first public release writeup if a frozen repo hash is required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gemini_2_5_flash:
    kind: llm
    provider: google
    model: gemini-2.5-flash
    tier: weak
    max_retries: 8
    retry_delay: 2.0
    generation_config:
      thinking_config:
        thinking_budget: 0

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_turn_reinforced_hp_grounded:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: |-
        {game_view}

        {controller_format}

        Before acting, calculate: does your current HP minus one ATTACK (20 damage) leave you alive? Let that determine your choice.

sampling_policy:
  pilot_matches_per_cell: 48
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 24
    side_swap_required: true
  expansion_selection_rules:
    - second_player_win_rate_improves_relative_to_threshold_1
    - full_stack_flash_lite_remains_cost_advantaged
    - parity_gap_is_directionally_or_inferentially_resolved

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package promotes the Threshold 1 mechanism winner into a dedicated
      parity test. Analysis must report position-controlled results explicitly
      and treat the second-player split as the primary diagnostic, not just the
      headline win count.
    matches_per_cell: 0
    required_checks:
      - parity_question_review
      - hp_grounding_prompt_review
      - cross_model_position_control_review
      - behavioral_endpoints_review
      - paired_side_swap_review
      - gemini_thinking_budget_zero_review
  phases:
    - phase_id: P1
      name: Full-Stack Parity Run
      cell_ids:
        - p1_c01_flash_lite_rc_tr_hp_vs_flash_ao

cells:
  - id: p1_c01_flash_lite_rc_tr_hp_vs_flash_ao
    phase: P1
    question: Can the full Flash-Lite strategy stack match or beat plain Flash at N=48 under paired side-swap fairness?
    intent: Run the competitive follow-up after Threshold 1 established the mechanism fix.
    causal_factor: strategy_stack
    fairness_notes: paired side-swap enabled; analysis must report both named-player and position-controlled results, with special attention to second-player wins
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: RC_turn_reinforced_hp_grounded
      name: FlashLite-RC-TR-HP
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true
