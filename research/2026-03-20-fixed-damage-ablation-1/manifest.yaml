schema_version: 1
experiment_id: 2026-03-20-fixed-damage-ablation-1
title: FixedDamage Ablation 1
status: complete
question: >-
  Does HP-threshold grounding still improve Flash-Lite against plain Gemini
  Flash when turn-time controller-format reinforcement is removed, leaving only
  the handshake contract plus the HP instruction?
game:
  name: FixedDamageGame
  config:
    max_health: 100
    attack_damage: 20
    potion_heal: 30
    starting_potions: 3
    information_level: partial
players:
  - id: gemini_2_5_flash_lite_rc_hp
    provider: google
    model: gemini-2.5-flash-lite
    controller: ReasoningController
    renderer: TextRenderer
  - id: gemini_2_5_flash_ao
    provider: google
    model: gemini-2.5-flash
    controller: ActionOnlyController
    renderer: TextRenderer
variants:
  models:
    - gemini-2.5-flash-lite
    - gemini-2.5-flash
  controllers:
    - ReasoningController
    - ActionOnlyController
  prompt_cadence:
    - handshake_only
  prompt_overlays:
    - hp_threshold_grounding
run:
  seed_base: 10242
  matches_planned: 48
  matches_completed: 48
  concurrency: 1
  max_turns: 30
  matrix_source: matrix.yaml
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  matrix_yaml: matrix.yaml
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
storage:
  raw_recordings:
    backend: local
    path: research/2026-03-20-fixed-damage-ablation-1/agentdeck_runs
  summaries:
    repo_path: research/2026-03-20-fixed-damage-ablation-1
  viewer_curation:
    repo_path: research/2026-03-20-fixed-damage-ablation-1/artifacts
notes: >-
  This package follows FixedDamage Parity 3. It ablates only one part of the
  winning Flash-Lite stack: turn-time controller-format reinforcement. The
  question is whether HP-threshold grounding still carries the policy when the
  turn prompt no longer repeats the controller-format reminder.
