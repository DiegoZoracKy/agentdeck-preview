schema_version: 1
experiment_id: 2026-03-23-fixed-damage-exit-1
created_at: "2026-03-23T00:00:00Z"
purpose: >-
  Final FixedDamage prompt-fix study testing whether a no-potion escape clause
  closes the known low-HP deadlock in the best Flash-Lite stack without
  changing the engine or the broader full-stack strategy.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_parity3_turn_modes_plus_exit_clause
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first public release writeup if a frozen repo hash is required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gemini_2_5_flash:
    kind: llm
    provider: google
    model: gemini-2.5-flash
    tier: weak
    max_retries: 12
    retry_delay: 4.0
    generation_config:
      thinking_config:
        thinking_budget: 0

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: true
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_turn_reinforced_hp_exit:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: true
    prompt_builder:
      turn_template_mode: custom
      turn_template: |-
        {game_view}

        {controller_format}

        Before acting, calculate: does your current HP minus one ATTACK (20 damage) leave you alive?
        If no and you still have potions, use POTION.
        If no and you have no potions, ATTACK anyway.
        Otherwise, act on your best read of the state.

sampling_policy:
  pilot_matches_per_cell: 48
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 24
    side_swap_required: true
  expansion_selection_rules:
    - no_potion_deadlock_disappears
    - second_player_win_rate_holds_or_improves_relative_to_parity_3
    - low_hp_tail_cost_drops_without_high_hp_regression

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package holds the full Flash-Lite stack fixed except for the prompt
      exit clause. Analysis should treat deadlock removal and second-player
      stability as the primary diagnostics, with tail-cost reduction as a
      secondary benefit.
    matches_per_cell: 0
    required_checks:
      - deadlock_prompt_review
      - low_hp_tail_review
      - paired_side_swap_review
      - gemini_thinking_budget_zero_review
  phases:
    - phase_id: P1
      name: Prompt Exit Fix Run
      cell_ids:
        - p1_c01_flash_lite_rc_tr_hp_exit_vs_flash_ao

cells:
  - id: p1_c01_flash_lite_rc_tr_hp_exit_vs_flash_ao
    phase: P1
    question: Can a no-potion escape clause remove Flash-Lite's low-HP reasoning deadlock while preserving the full-stack behavior against plain Flash?
    intent: Run one last FixedDamage prompt repair before moving on to VariableDamageGame.
    causal_factor: prompt_exit_clause
    fairness_notes: paired side-swap enabled; analysis must report named-player and position-controlled results, with special attention to second-player wins, low-HP state evidence, and tail-cost behavior
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: RC_turn_reinforced_hp_exit
      name: FlashLite-RC-TR-HP-exit
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true
