schema_version: 1
experiment_id: 2026-03-23-fixed-damage-exit-1
title: FixedDamage FlashLite Exit 1
status: complete
question: >-
  Can a no-potion escape clause remove the known low-HP deadlock in the best
  Flash-Lite stack while preserving its strong behavior against plain Gemini
  Flash?
game:
  name: FixedDamageGame
  config:
    max_health: 100
    attack_damage: 20
    potion_heal: 30
    starting_potions: 3
    information_level: partial
players:
  - id: gemini_2_5_flash_lite_rc_tr_hp_exit
    provider: google
    model: gemini-2.5-flash-lite
    controller: ReasoningController
    renderer: TextRenderer
  - id: gemini_2_5_flash_ao
    provider: google
    model: gemini-2.5-flash
    controller: ActionOnlyController
    renderer: TextRenderer
variants:
  models:
    - gemini-2.5-flash-lite
    - gemini-2.5-flash
  controllers:
    - ReasoningController
    - ActionOnlyController
  prompt_cadence:
    - turn_reinforced
  prompt_overlays:
    - hp_threshold_grounding_with_no_potion_exit
run:
  seed_base: 20242
  matches_planned: 48
  matches_completed: 48
  concurrency: 1
  max_turns: 30
  matrix_source: matrix.yaml
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  matrix_yaml: matrix.yaml
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
storage:
  raw_recordings:
    backend: local
    path: research/2026-03-23-fixed-damage-exit-1/agentdeck_runs
  summaries:
    repo_path: research/2026-03-23-fixed-damage-exit-1
  viewer_curation:
    repo_path: research/2026-03-23-fixed-damage-exit-1/artifacts
notes: >-
  Exit 1 is the final FixedDamage prompt-repair probe. The earlier HP
  grounding instruction created a logical deadlock at low HP with no potions
  left, which produced the worst reasoning-cost outliers in Parity 3. This
  package replaces that instruction with an explicit no-potion escape clause and
  tests whether the full Flash-Lite stack becomes cleaner and more stable
  without changing engine code.
