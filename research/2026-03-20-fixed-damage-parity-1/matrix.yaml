schema_version: 1
experiment_id: 2026-03-20-fixed-damage-parity-1
created_at: "2026-03-20T00:00:00Z"
purpose: >-
  FixedDamage cross-model parity pilot testing whether strategy-level reasoning
  can lift Gemini Flash-Lite enough to match or beat plain Gemini Flash under
  the same audited game, fairness settings, and handshake-only turn cadence.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_handshake_only_turns
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first public release writeup if a frozen repo hash is required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gemini_2_5_flash:
    kind: llm
    provider: google
    model: gemini-2.5-flash
    tier: weak
    max_retries: 8
    retry_delay: 2.0
    generation_config:
      thinking_config:
        thinking_budget: 0

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"

sampling_policy:
  pilot_matches_per_cell: 24
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 12
    side_swap_required: true
  expansion_selection_rules:
    - parity_gap_is_directionally_interesting
    - behavioral_delta_is_legible
    - weaker_model_remains_cost_advantaged

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package reuses the audited FixedDamage substrate and prior controller
      findings. The new question is cross-model parity, so analysis must report
      position-controlled results explicitly in addition to raw win rates.
    matches_per_cell: 0
    required_checks:
      - parity_question_review
      - cross_model_position_control_review
      - behavioral_endpoints_review
      - paired_side_swap_review
      - gemini_thinking_budget_zero_review
  phases:
    - phase_id: P1
      name: Cross-Model Parity Pilot
      cell_ids:
        - p1_c01_flash_lite_ao_vs_flash_ao
        - p1_c02_flash_lite_rc_vs_flash_ao

cells:
  - id: p1_c01_flash_lite_ao_vs_flash_ao
    phase: P1
    question: Is plain Gemini Flash superior to plain Gemini Flash-Lite in FixedDamage under the same contract?
    intent: Establish the baseline cross-model gap before testing reasoning as an equalizer.
    causal_factor: model_choice
    fairness_notes: paired side-swap enabled; analysis must report both named-player and position-controlled results
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: AO_handshake_only
      name: FlashLite-AO
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 24
    pilot_matches: 24
    viewer_priority: true

  - id: p1_c02_flash_lite_rc_vs_flash_ao
    phase: P1
    question: Can reasoning-lifted Flash-Lite match or beat plain Flash in FixedDamage?
    intent: Test controller as a competitive equalizer while keeping cadence and fairness fixed.
    causal_factor: strategy_stack
    fairness_notes: paired side-swap enabled; analysis must report both named-player and position-controlled results
    seed_offset: 100
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: RC_handshake_only
      name: FlashLite-RC
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 24
    pilot_matches: 24
    viewer_priority: true
