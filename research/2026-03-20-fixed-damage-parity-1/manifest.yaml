schema_version: 1
experiment_id: 2026-03-20-fixed-damage-parity-1
title: FixedDamage Parity 1
status: complete
question: >-
  Can strategy-level reasoning lift Gemini Flash-Lite enough to match or beat
  plain Gemini Flash in FixedDamage, and are any gains worth the added cost and
  latency?
game:
  name: FixedDamageGame
  config:
    max_health: 100
    attack_damage: 20
    potion_heal: 30
    starting_potions: 3
    information_level: partial
players:
  - id: gemini_2_5_flash_lite_ao
    provider: google
    model: gemini-2.5-flash-lite
    controller: ActionOnlyController
    renderer: TextRenderer
  - id: gemini_2_5_flash_lite_rc
    provider: google
    model: gemini-2.5-flash-lite
    controller: ReasoningController
    renderer: TextRenderer
  - id: gemini_2_5_flash_ao
    provider: google
    model: gemini-2.5-flash
    controller: ActionOnlyController
    renderer: TextRenderer
variants:
  models:
    - gemini-2.5-flash-lite
    - gemini-2.5-flash
  controllers:
    - ActionOnlyController
    - ReasoningController
  prompt_cadence:
    - handshake_only
run:
  seed_base: 6242
  matches_planned: 48
  matches_completed: 48
  concurrency: 1
  max_turns: 30
  matrix_source: matrix.yaml
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  matrix_yaml: matrix.yaml
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
storage:
  raw_recordings:
    backend: local
    path: research/2026-03-20-fixed-damage-parity-1/agentdeck_runs
  summaries:
    repo_path: research/2026-03-20-fixed-damage-parity-1
  viewer_curation:
    repo_path: research/2026-03-20-fixed-damage-parity-1/artifacts
notes: >-
  This package tests controller as a competitive equalizer. It keeps the same
  audited FixedDamage substrate and handshake-only cadence while comparing
  weaker Flash-Lite variants against plain Flash using a fresh seed family.
  The pilot completed at N=24 per cell without triggering an immediate
  expansion.
