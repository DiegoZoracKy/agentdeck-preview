schema_version: 1
experiment_id: 2026-03-21-fixed-damage-openai-parity-2
title: FixedDamage OpenAI Parity 2
status: complete
question: >-
  Can the full `gpt-4o-mini` stack (`ReasoningController` + turn
  reinforcement + HP-threshold grounding) match or beat plain `gpt-5-mini` in
  FixedDamage, after RC alone already failed?
game:
  name: FixedDamageGame
  config:
    max_health: 100
    attack_damage: 20
    potion_heal: 30
    starting_potions: 3
    information_level: partial
players:
  - id: gpt_4o_mini_full
    provider: openai
    model: gpt-4o-mini
    controller: ReasoningController
    renderer: TextRenderer
  - id: gpt_5_mini_ao
    provider: openai
    model: gpt-5-mini
    controller: ActionOnlyController
    renderer: TextRenderer
variants:
  models:
    - gpt-4o-mini
    - gpt-5-mini
  controllers:
    - ReasoningController
    - ActionOnlyController
  prompt_cadence:
    - turn_reinforced_hp_grounded
run:
  seed_base: 17242
  matches_planned: 48
  matches_completed: 48
  concurrency: 4
  max_turns: 30
  matrix_source: matrix.yaml
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  matrix_yaml: matrix.yaml
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
storage:
  raw_recordings:
    backend: local
    path: research/2026-03-21-fixed-damage-openai-parity-2/agentdeck_runs
  summaries:
    repo_path: research/2026-03-21-fixed-damage-openai-parity-2
  viewer_curation:
    repo_path: research/2026-03-21-fixed-damage-openai-parity-2/artifacts
notes: >-
  OpenAI Parity 2 is the last meaningful FixedDamage rung for this OpenAI-only
  ladder. It skips any more RC-only expansion and tests the full stack
  directly against plain `gpt-5-mini` on a fresh seed family. The result was a
  meaningful recovery over RC-only, but not a competitive breakthrough.
