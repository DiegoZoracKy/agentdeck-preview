schema_version: 1
experiment_id: 2026-03-19-fixed-damage-release-1
created_at: "2026-03-19T00:00:00Z"
purpose: >-
  Release-facing FixedDamage study demonstrating calibration, fairness, replay,
  and prompt-cadence sensitivity using AgentDeck-native configuration only.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_turn_variant
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first executed public batch.

player_registry:
  attack_bot:
    kind: bot
    provider: local
    model: AttackBot
    class: AttackBot
    tier: calibration
  potion_at_80_bot:
    kind: bot
    provider: local
    model: PotionAt80Bot
    class: PotionAt80Bot
    tier: calibration
  gpt_4o_mini:
    kind: llm
    provider: openai
    model: gpt-4o-mini
    tier: weak
  claude_haiku_4_5_20251001:
    kind: llm
    provider: anthropic
    model: claude-haiku-4-5-20251001
    tier: weak

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: default
      turn_template: "{game_view}"
  AO_turn_reinforced:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}\n\n{controller_format}"

sampling_policy:
  phase0_matches_per_cell: 24
  phase1_pilot_matches_per_cell: 24
  phase1_expansion_target_matches_per_selected_cell: 80
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 12
    side_swap_required: true
  expansion_selection_rules:
    - directionally_interesting_delta
    - replay_mechanism_is_legible
    - artifact_validation_clean

execution_plan:
  preflight:
    cell_ids:
      - p0_c01_attack_vs_attack
      - p0_c02_attack_vs_potion80
    matches_per_cell: 6
    required_checks:
      - fixed_damage_two_player_contract
      - game_default_handshake_review
      - paired_side_swap_review
      - partial_information_public_last_action_review
  phases:
    - phase_id: P0
      name: Calibration
      cell_ids:
        - p0_c01_attack_vs_attack
        - p0_c02_attack_vs_potion80
    - phase_id: P1
      name: Cadence Pilot
      cell_ids:
        - p1_c01_mini_ho_vs_tr
        - p1_c02_haiku_ho_vs_tr

cells:
  - id: p0_c01_attack_vs_attack
    phase: P0
    question: Does paired side-swap surface the expected first-player effect under a dominant deterministic policy?
    intent: Calibrate environment and fairness machinery before provider runs.
    causal_factor: calibration_fairness
    fairness_notes: paired side-swap enabled; use this cell to verify pure position effect
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: attack_bot
      config_ref: AO_handshake_only
      name: Attack-A
    player_b:
      player_ref: attack_bot
      config_ref: AO_handshake_only
      name: Attack-B
    matches: 24
    viewer_priority: true

  - id: p0_c02_attack_vs_potion80
    phase: P0
    question: Can AgentDeck make a clearly suboptimal FixedDamage policy visible through results and replay?
    intent: Establish dominant-vs-suboptimal contrast before LLM variance enters.
    causal_factor: calibration_policy_quality
    fairness_notes: paired side-swap enabled; compare policy quality, not raw topline only
    seed_offset: 100
    game:
      information_level: partial
    player_a:
      player_ref: attack_bot
      config_ref: AO_handshake_only
      name: AttackBot
    player_b:
      player_ref: potion_at_80_bot
      config_ref: AO_handshake_only
      name: PotionAt80Bot
    matches: 24
    viewer_priority: true

  - id: p1_c01_mini_ho_vs_tr
    phase: P1
    question: Does turn-level format reinforcement change gpt-4o-mini behavior in FixedDamage?
    intent: Within-model cadence comparison using identical model and game configuration.
    causal_factor: prompt_cadence
    fairness_notes: paired side-swap enabled; same model, differing turn-template cadence
    seed_offset: 1000
    game:
      information_level: partial
    player_a:
      player_ref: gpt_4o_mini
      config_ref: AO_handshake_only
      name: Mini-HO
    player_b:
      player_ref: gpt_4o_mini
      config_ref: AO_turn_reinforced
      name: Mini-TR
    matches: 24
    expansion_target_matches: 80
    viewer_priority: true

  - id: p1_c02_haiku_ho_vs_tr
    phase: P1
    question: Does turn-level format reinforcement change Claude Haiku behavior in FixedDamage?
    intent: Within-model cadence comparison using identical model and game configuration.
    causal_factor: prompt_cadence
    fairness_notes: paired side-swap enabled; same model, differing turn-template cadence
    seed_offset: 1100
    game:
      information_level: partial
    player_a:
      player_ref: claude_haiku_4_5_20251001
      config_ref: AO_handshake_only
      name: Haiku-HO
    player_b:
      player_ref: claude_haiku_4_5_20251001
      config_ref: AO_turn_reinforced
      name: Haiku-TR
    matches: 24
    expansion_target_matches: 80
    viewer_priority: true

