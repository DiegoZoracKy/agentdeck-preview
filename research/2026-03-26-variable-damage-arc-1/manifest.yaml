schema_version: 1
experiment_id: 2026-03-26-variable-damage-arc-1
title: VariableDamage Arc 1
status: complete
question: >-
  What did the full VariableDamage research arc establish about uncertainty,
  transfer, and the final canonical Flash-Lite configuration to carry forward
  for release-facing examples?
game:
  name: VariableDamageGame
  config:
    max_health: 100
    min_attack_damage: 15
    max_attack_damage: 25
    potion_heal: 30
    starting_potions: 3
    information_level: partial
players:
  - id: attack_bot
    provider: local
    model: AttackBot
  - id: potion_at_80_bot
    provider: local
    model: PotionAt80Bot
  - id: gemini_flash_lite
    provider: google
    model: gemini-2.5-flash-lite
  - id: gemini_flash
    provider: google
    model: gemini-2.5-flash
  - id: gpt_4o_mini
    provider: openai
    model: gpt-4o-mini
  - id: gpt_4o
    provider: openai
    model: gpt-4o
  - id: gpt_5_mini
    provider: openai
    model: gpt-5-mini
  - id: claude_haiku
    provider: anthropic
    model: claude-haiku-4-5-20251001
variants:
  models:
    - AttackBot
    - PotionAt80Bot
    - gemini-2.5-flash-lite
    - gemini-2.5-flash
    - gpt-4o-mini
    - gpt-4o
    - gpt-5-mini
    - claude-haiku-4-5-20251001
  controllers:
    - ActionOnlyController
    - ReasoningController
  prompt_cadence:
    - handshake_only
    - turn_reinforced
    - risk_grounded_turn
  prompt_overlays:
    - risk_band_grounding
run:
  seed_base: 21242
  matches_planned: 0
  matches_completed: 0
analysis_plan:
  ci_method: exact_binomial
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
storage:
  raw_recordings:
    backend: local
    path: research/2026-03-26-variable-damage-arc-1/recordings
  summaries:
    repo_path: research/2026-03-26-variable-damage-arc-1
  viewer_curation:
    repo_path: research/2026-03-26-variable-damage-arc-1/artifacts
notes: >-
  Summary-only umbrella package for the full VariableDamage branch. This
  package does not add new matches; it consolidates 12 completed VariableDamage
  packages totaling 744 matches and surfaces the final carry-forward
  configuration: FlashLite-RC-RISK from the Parity 1 and Premium Final 1
  line.
