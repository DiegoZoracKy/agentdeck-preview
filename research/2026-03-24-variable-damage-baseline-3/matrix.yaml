schema_version: 1
experiment_id: 2026-03-24-variable-damage-baseline-3
created_at: "2026-03-24T00:00:00Z"
purpose: >-
  VariableDamage stronger-model AO round-robin establishing how plain Flash,
  plain GPT-4o Mini, and plain Claude Haiku compare under seeded stochastic
  damage before any controller or prompt-stack intervention is attempted on
  those stronger baselines.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_turn_variant
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first executed VariableDamage stronger-model round-robin batch.

player_registry:
  gemini_2_5_flash:
    kind: llm
    provider: google
    model: gemini-2.5-flash
    tier: weak
    max_retries: 12
    retry_delay: 4.0
    generation_config:
      thinking_config:
        thinking_budget: 0
  gpt_4o_mini:
    kind: llm
    provider: openai
    model: gpt-4o-mini
    tier: weak
  claude_haiku_4_5_20251001:
    kind: llm
    provider: anthropic
    model: claude-haiku-4-5-20251001
    tier: weak

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: true
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"

sampling_policy:
  pilot_matches_per_cell: 48
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 24
    side_swap_required: true
  expansion_selection_rules:
    - stronger_plain_model_ordering_is_estimated
    - risk_band_behavior_is_legible
    - no_controller_branch_is_implied_without_specific_failure_evidence

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package is baseline-only. Analysis must separate plain-model outcome
      ordering from specific risk-band policy differences and must not imply an
      RC branch for Flash, Mini, or Haiku unless a coherent and actionable
      failure mode appears in the exported behavior.
    matches_per_cell: 0
    required_checks:
      - cross_provider_position_control_review
      - risk_band_behavior_review
      - paired_side_swap_review
      - stronger_model_ordering_review
  phases:
    - phase_id: P1
      name: Stronger-Model AO Round Robin
      cell_ids:
        - p1_c01_mini_ao_vs_flash_ao
        - p1_c02_haiku_ao_vs_flash_ao
        - p1_c03_mini_ao_vs_haiku_ao

cells:
  - id: p1_c01_mini_ao_vs_flash_ao
    phase: P1
    question: How does plain GPT-4o Mini compare to plain Flash in VariableDamage before any controller intervention?
    intent: Establish whether Mini's conservative VariableDamage baseline holds up against a stronger Gemini plain baseline.
    causal_factor: baseline_model_policy
    fairness_notes: paired side-swap enabled; analysis must report both raw and position-controlled results, with special attention to safe-zone and danger-zone healing splits
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gpt_4o_mini
      config_ref: AO_handshake_only
      name: Mini-AO
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true

  - id: p1_c02_haiku_ao_vs_flash_ao
    phase: P1
    question: How does plain Claude Haiku compare to plain Flash in VariableDamage before any controller intervention?
    intent: Establish whether Haiku's strong VariableDamage baseline remains stronger than Flash when measured head-to-head.
    causal_factor: baseline_model_policy
    fairness_notes: paired side-swap enabled; analysis must report both raw and position-controlled results, with special attention to risk-band policy deltas and second-player survival behavior
    seed_offset: 100
    game:
      information_level: partial
    player_a:
      player_ref: claude_haiku_4_5_20251001
      config_ref: AO_handshake_only
      name: Haiku-AO
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true

  - id: p1_c03_mini_ao_vs_haiku_ao
    phase: P1
    question: How does plain GPT-4o Mini compare to plain Claude Haiku in VariableDamage before any controller intervention?
    intent: Complete the stronger-model plain ordering under uncertainty without importing any controller or prompt-stack intervention.
    causal_factor: baseline_model_policy
    fairness_notes: paired side-swap enabled; analysis must report both raw and position-controlled results, with special attention to safe-zone conservatism versus lethal-zone defense
    seed_offset: 200
    game:
      information_level: partial
    player_a:
      player_ref: gpt_4o_mini
      config_ref: AO_handshake_only
      name: Mini-AO
    player_b:
      player_ref: claude_haiku_4_5_20251001
      config_ref: AO_handshake_only
      name: Haiku-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true
