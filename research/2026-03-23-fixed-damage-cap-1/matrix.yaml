schema_version: 1
experiment_id: 2026-03-23-fixed-damage-cap-1
created_at: "2026-03-23T00:00:00Z"
purpose: >-
  FixedDamage cost-optimization study testing whether the best known Flash-Lite
  strategy stack can keep its competitive behavior against plain Gemini Flash
  under a mild `max_tokens=128` output cap.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_parity3_turn_modes
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first public release writeup if a frozen repo hash is required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    max_tokens: 128
    generation_config:
      thinking_config:
        thinking_budget: 0
  gemini_2_5_flash:
    kind: llm
    provider: google
    model: gemini-2.5-flash
    tier: weak
    max_retries: 12
    retry_delay: 4.0
    generation_config:
      thinking_config:
        thinking_budget: 0

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: true
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_turn_reinforced_hp_grounded:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: true
    prompt_builder:
      turn_template_mode: custom
      turn_template: |-
        {game_view}

        {controller_format}

        Before acting, calculate: does your current HP minus one ATTACK (20 damage) leave you alive? Let that determine your choice.

sampling_policy:
  pilot_matches_per_cell: 48
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 24
    side_swap_required: true
  expansion_selection_rules:
    - capped_full_stack_preserves_second_player_conversion
    - capped_full_stack_reduces_flash_lite_cost
    - capped_full_stack_avoids_critical_state_regression

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package holds the full Flash-Lite stack fixed except for the new
      `max_tokens=128` cap. Analysis should treat cost reduction as the target
      outcome and explicitly check for regressions in critical low-HP state
      behavior and second-player wins.
    matches_per_cell: 0
    required_checks:
      - cap_design_review
      - behavioral_regression_review
      - paired_side_swap_review
      - gemini_thinking_budget_zero_review
  phases:
    - phase_id: P1
      name: Max-Token Cap Run
      cell_ids:
        - p1_c01_flash_lite_rc_tr_hp_cap128_vs_flash_ao

cells:
  - id: p1_c01_flash_lite_rc_tr_hp_cap128_vs_flash_ao
    phase: P1
    question: Can `max_tokens=128` keep Flash-Lite competitive with plain Flash while trimming enough output overhead to matter on cost?
    intent: Run the first mild cap rung before trying a stronger cap like `112`.
    causal_factor: output_cap
    fairness_notes: paired side-swap enabled; analysis must report named-player and position-controlled results, with special attention to second-player wins and critical-state regressions
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: RC_turn_reinforced_hp_grounded
      name: FlashLite-RC-TR-HP-cap128
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true
