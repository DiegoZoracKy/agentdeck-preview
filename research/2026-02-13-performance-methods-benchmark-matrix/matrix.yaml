schema_version: 1
experiment_id: 2026-02-13-performance-methods-benchmark-matrix-v2-openai-anchor
created_at: "2026-02-13T00:00:00Z"
purpose: >-
  Narrative-first benchmark matrix focused on proving cost-efficiency through
  strategy tuning: optimize gpt-4o-mini first, then challenge stronger OpenAI
  models (gpt-4o, gpt-5.2), then compare against Anthropic and Google tiers.

frozen_inputs:
  git_tag: untagged
  git_commit: 9ec7414331b167335865cca227e9139c3da06c2f
  prompt_template_version: commit-9ec7414
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Frozen for preflight on 2026-02-19T02:02:48Z.

model_registry:
  openai_weak:
    provider: openai
    model: gpt-4o-mini
    tier: weak
  openai_strong:
    provider: openai
    model: gpt-4o
    tier: strong
  openai_top:
    provider: openai
    model: gpt-5.2
    tier: top
  anthropic_weak:
    provider: anthropic
    model: claude-haiku-4.5
    tier: weak
  anthropic_strong:
    provider: anthropic
    model: claude-sonnet-4.5
    tier: strong
  google_weak:
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
  google_strong:
    provider: google
    model: gemini-2.5-pro
    tier: strong

config_registry:
  AO:
    controller: ActionOnlyController
    prompt_builder:
      turn_template_mode: default
      turn_template: "{game_view}\\n\\n{controller_format}"
    interpretation: raw_model_intelligence
  CoT-H:
    controller: ReasoningController
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
    interpretation: reasoning_with_handshake_only_instruction
  CoT-T:
    controller: ReasoningController
    prompt_builder:
      turn_template_mode: default
      turn_template: "{game_view}\\n\\n{controller_format}"
    interpretation: reasoning_with_persistent_turn_instruction

strategy_assumptions:
  provisional_best_config: CoT-T
  provisional_worst_config: AO
  validation_tracks:
    - 1
    - 2
    - 3
    - 4
  note: >-
    If discovery/calibration contradicts provisional assumptions, replace config
    refs in tracks 5-6 before full expansion.

sampling_policy:
  pilot_matches_per_cell: 24
  expansion_target_matches_per_selected_cell: 80
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 12
    side_swap_required: true
  expansion_selection_rules:
    - ci_width_gt_0.2
    - p_value_between_0.03_and_0.2
    - viewer_priority_flag_true
  expansion_selection_rule_definitions:
    ci_width_gt_0.2: widen sample when uncertainty remains high
    p_value_between_0.03_and_0.2: increase power for borderline effects
    viewer_priority_flag_true: prioritize cells marked viewer_priority=true
  manual_expansion_override:
    enabled: true
    tracking:
      required_log_file: logs/expansion-overrides.md
      required_fields:
        - cell_id
        - reason
        - approver
        - timestamp_utc
  reliability_gate:
    max_forfeit_rate: 0.05
    action_if_exceeded: rerun_after_config_fix

execution_plan:
  preflight:
    description: 4 sentinel cells to validate OpenAI-top + Anthropic + Google stability.
    cell_ids:
      - c02_t1_openai_weak_ao_vs_cott
      - c07_t3_openai_top_ao_vs_cott
      - c08_t4_anthropic_weak_ao_vs_cott
      - c10_t4_google_weak_ao_vs_cott
    matches_per_cell: 6
  phases:
    - phase_id: A1
      name: OpenAI Strategy Discovery
      tracks: [1, 2, 3]
      cell_ids:
        - c01_t1_openai_weak_ao_vs_coth
        - c02_t1_openai_weak_ao_vs_cott
        - c03_t1_openai_weak_coth_vs_cott
        - c04_t2_openai_strong_ao_vs_coth
        - c05_t2_openai_strong_ao_vs_cott
        - c06_t2_openai_strong_coth_vs_cott
        - c07_t3_openai_top_ao_vs_cott
      publish_drop: true
    - phase_id: A2
      name: Opponent Strategy Calibration
      tracks: [4]
      cell_ids:
        - c08_t4_anthropic_weak_ao_vs_cott
        - c09_t4_anthropic_strong_ao_vs_cott
        - c10_t4_google_weak_ao_vs_cott
        - c11_t4_google_strong_ao_vs_cott
      publish_drop: true
    - phase_id: A3
      name: OpenAI Cost-Efficiency Showcase
      tracks: [5]
      cell_ids:
        - c12_t5_mini_best_vs_4o_worst
        - c13_t5_mini_best_vs_4o_best
        - c14_t5_mini_worst_vs_4o_best
        - c15_t5_mini_best_vs_52_worst
        - c16_t5_mini_best_vs_52_best
        - c17_t5_mini_worst_vs_52_best
      publish_drop: true
    - phase_id: A4
      name: Cross-Provider Challenge
      tracks: [6]
      cell_ids:
        - c18_t6_mini_best_vs_anthropic_weak_best
        - c19_t6_mini_best_vs_anthropic_strong_best
        - c20_t6_mini_best_vs_google_weak_best
        - c21_t6_mini_best_vs_google_strong_best
        - c22_t6_mini_worst_vs_anthropic_weak_best
        - c23_t6_mini_worst_vs_anthropic_strong_best
        - c24_t6_mini_worst_vs_google_weak_best
        - c25_t6_mini_worst_vs_google_strong_best
      publish_drop: true

highlight_tag_rules:
  clutch:
    definition: winner_hp_lte_20
  comeback:
    definition: winner_trailed_by_gte_40_hp_at_any_turn
  chaos:
    definition: hp_lead_swings_gte_3
  dumb_decision:
    definition:
      - potion_used_at_full_hp
      - repeated_non_effective_actions
  cost_upset:
    definition: lower_cost_player_wins_with_margin_gte_0.1

