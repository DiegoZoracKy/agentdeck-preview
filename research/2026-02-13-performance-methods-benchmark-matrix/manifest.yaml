schema_version: 1
experiment_id: 2026-02-13-performance-methods-benchmark-matrix
title: Performance Methods Benchmark Matrix v2 (OpenAI Anchor)
status: planned
question: >-
  How much can strategy tuning (AO vs CoT-H vs CoT-T) close or overturn model-tier
  gaps by making gpt-4o-mini cost-efficient against stronger OpenAI, Anthropic,
  and Google models in FixedDamageGame?
game:
  name: FixedDamageGame
  config:
    information_level: partial
players:
  - id: A
    provider: mixed
    model: mixed
  - id: B
    provider: mixed
    model: mixed
variants:
  models:
    - gpt-4o-mini
    - gpt-4o
    - gpt-5.2
    - claude-haiku-4.5
    - claude-sonnet-4.5
    - gemini-2.5-flash-lite
    - gemini-2.5-pro
  controllers:
    - ActionOnlyController
    - ReasoningController
  prompt_cadence:
    - handshake_only
    - turn_persistent
run:
  seed_base: 420000
  matches_planned: 600
  matches_completed: 0
  concurrency: 10
  max_turns: 30
  matrix_source: matrix.yaml
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  matrix_yaml: matrix.yaml
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
  highlights_json: artifacts/highlights.json
  cells_parquet: artifacts/cells.parquet
  matches_parquet: artifacts/matches.parquet
storage:
  raw_recordings:
    backend: huggingface
    dataset: agentdeck/replays
    path_prefix: 2026-q1-performance-methods-matrix-v2
  summaries:
    repo_path: research/2026-02-13-performance-methods-benchmark-matrix
  viewer_curation:
    repo_path: viewer/matches
notes: >-
  Code + templates MUST be frozen with a git tag before execution. This package
  uses the v2 OpenAI-anchor matrix (25 cells). Pilot scope is 600 matches; full
  expansion ceiling is 2120 matches depending on selection rules.
