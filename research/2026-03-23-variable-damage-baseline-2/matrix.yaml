schema_version: 1
experiment_id: 2026-03-23-variable-damage-baseline-2
created_at: "2026-03-23T00:00:00Z"
purpose: >-
  VariableDamage cross-provider AO baseline sweep establishing how plain
  Flash-Lite compares to plain GPT-4o Mini and plain Claude Haiku under seeded
  stochastic damage before any controller or prompt-stack intervention is
  attempted.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_turn_variant
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first executed VariableDamage cross-provider batch.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gpt_4o_mini:
    kind: llm
    provider: openai
    model: gpt-4o-mini
    tier: weak
  claude_haiku_4_5_20251001:
    kind: llm
    provider: anthropic
    model: claude-haiku-4-5-20251001
    tier: weak

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"

sampling_policy:
  pilot_matches_per_cell: 48
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 24
    side_swap_required: true
  expansion_selection_rules:
    - plain_cross_provider_gap_is_estimated
    - risk_band_pathology_is_legible
    - rc_candidate_is_identified_without_turn_overlays

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package is baseline-only. Analysis must separate plain-model outcome
      gaps from specific risk-band failures and use those failures, not raw win
      rates alone, to decide whether Mini or Haiku deserve an RC branch next.
    matches_per_cell: 0
    required_checks:
      - cross_provider_position_control_review
      - risk_band_behavior_review
      - paired_side_swap_review
      - variable_damage_baseline_question_review
  phases:
    - phase_id: P1
      name: Cross-Provider AO Sweep
      cell_ids:
        - p1_c01_flash_lite_ao_vs_mini_ao
        - p1_c02_flash_lite_ao_vs_haiku_ao

cells:
  - id: p1_c01_flash_lite_ao_vs_mini_ao
    phase: P1
    question: How does plain Flash-Lite compare to plain GPT-4o Mini in VariableDamage before any controller intervention?
    intent: Establish the OpenAI baseline gap under uncertainty before testing RC or any guided prompt.
    causal_factor: baseline_model_policy
    fairness_notes: paired side-swap enabled; analysis must report both raw and position-controlled results, with special attention to danger-band and lethal-band action splits
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: AO_handshake_only
      name: FlashLite-AO
    player_b:
      player_ref: gpt_4o_mini
      config_ref: AO_handshake_only
      name: Mini-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true

  - id: p1_c02_flash_lite_ao_vs_haiku_ao
    phase: P1
    question: How does plain Flash-Lite compare to plain Claude Haiku in VariableDamage before any controller intervention?
    intent: Establish the Anthropic baseline gap under uncertainty before testing RC or any guided prompt.
    causal_factor: baseline_model_policy
    fairness_notes: paired side-swap enabled; analysis must report both raw and position-controlled results, with special attention to risk-band policy deltas and second-player survival behavior
    seed_offset: 100
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: AO_handshake_only
      name: FlashLite-AO
    player_b:
      player_ref: claude_haiku_4_5_20251001
      config_ref: AO_handshake_only
      name: Haiku-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true
