schema_version: 1
experiment_id: 2026-03-21-fixed-damage-openai-parity-1
title: FixedDamage OpenAI Parity 1
status: complete
question: >-
  What is the plain-model gap between `gpt-4o-mini` and `gpt-5-mini` in
  FixedDamage, and is `ReasoningController` alone enough to make the cheaper
  model competitive with the stronger plain baseline?
game:
  name: FixedDamageGame
  config:
    max_health: 100
    attack_damage: 20
    potion_heal: 30
    starting_potions: 3
    information_level: partial
players:
  - id: gpt_4o_mini_ao
    provider: openai
    model: gpt-4o-mini
    controller: ActionOnlyController
    renderer: TextRenderer
  - id: gpt_4o_mini_rc
    provider: openai
    model: gpt-4o-mini
    controller: ReasoningController
    renderer: TextRenderer
  - id: gpt_5_mini_ao
    provider: openai
    model: gpt-5-mini
    controller: ActionOnlyController
    renderer: TextRenderer
variants:
  models:
    - gpt-4o-mini
    - gpt-5-mini
  controllers:
    - ActionOnlyController
    - ReasoningController
  prompt_cadence:
    - handshake_only
run:
  seed_base: 16242
  matches_planned: 96
  matches_completed: 96
  concurrency: 4
  max_turns: 30
  matrix_source: matrix.yaml
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  matrix_yaml: matrix.yaml
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
storage:
  raw_recordings:
    backend: local
    path: research/2026-03-21-fixed-damage-openai-parity-1/agentdeck_runs
  summaries:
    repo_path: research/2026-03-21-fixed-damage-openai-parity-1
  viewer_curation:
    repo_path: research/2026-03-21-fixed-damage-openai-parity-1/artifacts
notes: >-
  This package keeps the intervention ladder clean. First establish the plain
  `gpt-4o-mini` to plain `gpt-5-mini` gap, then add `ReasoningController`
  alone before considering any heavier turn-time overlays. RC-alone turned out
  to be counterproductive in this game, so this package closes that branch of
  the ladder rather than extending it.
