schema_version: 1
experiment_id: 2026-03-21-fixed-damage-ablation-2
created_at: "2026-03-21T00:00:00Z"
purpose: >-
  FixedDamage ablation testing whether Flash-Lite can recover most of the
  HP-threshold benefits against plain Gemini Flash using ActionOnly prompting
  overlays alone, and whether turn-time reinforcement still matters once the
  HP survival hint is present.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_ao_threshold_turn_modes
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first public release writeup if a frozen repo hash is required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gemini_2_5_flash:
    kind: llm
    provider: google
    model: gemini-2.5-flash
    tier: weak
    max_retries: 8
    retry_delay: 2.0
    generation_config:
      thinking_config:
        thinking_budget: 0

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  AO_turn_hp_grounded:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: |-
        {game_view}

        Before acting, calculate: does your current HP minus one ATTACK (20 damage) leave you alive? Let that determine your choice.
  AO_turn_reinforced_hp_grounded:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: |-
        {game_view}

        {controller_format}

        Before acting, calculate: does your current HP minus one ATTACK (20 damage) leave you alive? Let that determine your choice.

sampling_policy:
  pilot_matches_per_cell: 24
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 12
    side_swap_required: true
  expansion_selection_rules:
    - hp_grounding_improves_actiononly_threshold_behavior
    - turn_reinforcement_adds_policy_stability_without_reasoning_controller
    - cheaper_stack_closes_gap_to_plain_flash

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package keeps the audited FixedDamage substrate and the plain Flash
      ActionOnly baseline while removing ReasoningController entirely from the
      Flash-Lite side. Analysis should compare HP-only versus reinforced HP
      directly and report whether the cheaper overlays preserve the low-HP
      policy corrections seen in the full-stack arc.
    matches_per_cell: 0
    required_checks:
      - action_only_overlay_prompt_review
      - cross_model_position_control_review
      - behavioral_endpoints_review
      - paired_side_swap_review
      - gemini_thinking_budget_zero_review
  phases:
    - phase_id: P1
      name: ActionOnly Overlay Pilot
      cell_ids:
        - p1_c01_flash_lite_ao_hp_vs_flash_ao
        - p1_c02_flash_lite_ao_tr_hp_vs_flash_ao

cells:
  - id: p1_c01_flash_lite_ao_hp_vs_flash_ao
    phase: P1
    question: Does HP-threshold grounding alone improve plain Flash-Lite enough to close the gap to plain Flash?
    intent: Test the survival-threshold hint without turn-time ActionOnly reinforcement.
    causal_factor: hp_threshold_grounding
    fairness_notes: paired side-swap enabled; analysis must report both named-player and position-controlled results
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: AO_turn_hp_grounded
      name: FlashLite-AO-HP
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 24
    pilot_matches: 24
    viewer_priority: true

  - id: p1_c02_flash_lite_ao_tr_hp_vs_flash_ao
    phase: P1
    question: Does turn-reinforced ActionOnly plus HP-threshold grounding recover more of the full-stack gains than HP-grounding alone?
    intent: Test whether the cheap turn-time controller reminder still matters once the HP survival hint is present.
    causal_factor: turn_reinforcement
    fairness_notes: paired side-swap enabled; analysis must report both named-player and position-controlled results
    seed_offset: 100
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: AO_turn_reinforced_hp_grounded
      name: FlashLite-AO-TR-HP
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 24
    pilot_matches: 24
    viewer_priority: true
