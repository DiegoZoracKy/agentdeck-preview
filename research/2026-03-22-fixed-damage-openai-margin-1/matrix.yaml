schema_version: 1
experiment_id: 2026-03-22-fixed-damage-openai-margin-1
created_at: "2026-03-21T00:00:00Z"
purpose: >-
  FixedDamage OpenAI mechanism follow-up testing whether a forward-projected
  HP-margin reminder can fix the remaining medium-to-low HP over-aggression in
  the full `gpt-4o-mini` stack against plain `gpt-5-mini` under the same
  audited game and fairness settings.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_openai_margin_turn_modes
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first public release writeup if a frozen repo hash is required.

player_registry:
  gpt_4o_mini:
    kind: llm
    provider: openai
    model: gpt-4o-mini
    tier: weak
  gpt_5_mini:
    kind: llm
    provider: openai
    model: gpt-5-mini
    tier: strong

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_turn_reinforced_hp_grounded:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: |-
        {game_view}

        {controller_format}

        Before acting, calculate: does your current HP minus one ATTACK (20 damage) leave you alive? Let that determine your choice.
  RC_turn_reinforced_margin_grounded:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: |-
        {game_view}

        {controller_format}

        Before acting, calculate: if I ATTACK now and the opponent ATTACKs back for 20 damage, what will my HP be? If that leaves me below 20 HP and I still have potions, use POTION now rather than waiting.

sampling_policy:
  pilot_matches_per_cell: 48
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 24
    side_swap_required: true
  expansion_selection_rules:
    - full_stack_is_competitive_or_better
    - second_player_win_rate_improves_relative_to_rc_only
    - cheaper_model_remains_materially_cost_advantaged

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package is the final OpenAI-only FixedDamage mechanism probe.
      Analysis must report position-controlled results explicitly and compare
      the existing full stack against the new margin-grounded variant, with
      second-player wins as the primary diagnostic.
    matches_per_cell: 0
    required_checks:
      - full_stack_question_review
      - hp_grounding_prompt_review
      - cross_model_position_control_review
      - behavioral_endpoints_review
      - paired_side_swap_review
  phases:
    - phase_id: P1
      name: OpenAI Margin Mechanism Run
      cell_ids:
        - p1_c01_gpt4omini_rc_tr_hp_vs_gpt5mini_ao
        - p1_c02_gpt4omini_rc_tr_margin_vs_gpt5mini_ao

cells:
  - id: p1_c01_gpt4omini_rc_tr_hp_vs_gpt5mini_ao
    phase: P1
    question: Does the existing `gpt-4o-mini` full stack reproduce its OpenAI Parity 2 behavior on a fresh seed family as the within-package control?
    intent: Establish the control behavior before testing the new margin-grounded turn instruction.
    causal_factor: control_replication
    fairness_notes: paired side-swap enabled; analysis must report both named-player and position-controlled results, with special attention to second-player wins
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gpt_4o_mini
      config_ref: RC_turn_reinforced_hp_grounded
      name: GPT4oMini-RC-TR-HP
    player_b:
      player_ref: gpt_5_mini
      config_ref: AO_handshake_only
      name: GPT5Mini-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true
  - id: p1_c02_gpt4omini_rc_tr_margin_vs_gpt5mini_ao
    phase: P1
    question: Does a forward-projected HP-margin reminder improve second-player conversion for full-stack `gpt-4o-mini` against plain `gpt-5-mini` at `N=48`?
    intent: Test the final targeted prompt probe for the residual medium-to-low HP over-aggression seen in the full-stack control.
    causal_factor: margin_instruction
    fairness_notes: paired side-swap enabled; analysis must report both named-player and position-controlled results, with special attention to second-player wins
    seed_offset: 1000
    game:
      information_level: partial
    player_a:
      player_ref: gpt_4o_mini
      config_ref: RC_turn_reinforced_margin_grounded
      name: GPT4oMini-RC-TR-MARGIN
    player_b:
      player_ref: gpt_5_mini
      config_ref: AO_handshake_only
      name: GPT5Mini-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true
