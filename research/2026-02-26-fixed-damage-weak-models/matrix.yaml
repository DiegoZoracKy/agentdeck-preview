schema_version: 1
experiment_id: 2026-02-26-fixed-damage-weak-models-v3
created_at: "2026-02-26T00:00:00Z"
purpose: >-
  FixedDamage capability-floor benchmark for weak models in AO mode.
  Tests whether each model can execute the trivially optimal P1 strategy
  (always attack) and how they behave as P2. Includes Gemini 2.5 Flash
  as the third provider alongside OpenAI gpt-4o-mini and Anthropic Haiku.

model_registry:
  openai_weak_mini:
    provider: openai
    model: gpt-4o-mini
    tier: weak
  anthropic_weak_haiku:
    provider: anthropic
    model: claude-3-haiku-20240307
    tier: weak
  google_weak_flash:
    provider: google
    model: gemini-2.5-flash
    tier: weak

config_registry:
  AO_HANDSHAKE_PLUS_TURN_FORMAT:
    controller: ActionOnlyController
    prompt_builder:
      handshake_template_mode: custom
      handshake_template: |-
        {game_instructions}

        For gameplay turns, use the response format below:
        ACTION: [Your chosen action]
        Allowed actions are defined by the game instructions above.

        This is a handshake check before the match starts. Please reply with only OK so we can begin.
      turn_template_mode: default
      turn_template: "{game_view}\\n\\n{controller_format}"
    interpretation: action_only_with_turn_format_reinforcement

  AO_HANDSHAKE_ONLY_FORMAT:
    controller: ActionOnlyController
    prompt_builder:
      handshake_template_mode: custom
      handshake_template: |-
        {game_instructions}

        For gameplay turns, use the response format below:
        ACTION: [Your chosen action]
        Allowed actions are defined by the game instructions above.

        This is a handshake check before the match starts. Please reply with only OK so we can begin.
      turn_template_mode: custom
      turn_template: "{game_view}"
    interpretation: action_only_handshake_only_format

sampling_policy:
  pilot_matches_per_cell: 24
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 12
    side_swap_required: true

execution_plan:
  preflight:
    description: Single pilot cell for weak-model cross-provider AO benchmark.
    cell_ids:
      - c01_fd_mini_ao_vs_haiku_ao
    matches_per_cell: 24
  phases:
    - phase_id: B1
      name: Weak Models AO FixedDamage — Cross-provider pilot
      tracks: [1]
      cell_ids:
        - c01_fd_mini_ao_vs_haiku_ao
      status: complete
      publish_drop: true
    - phase_id: B2
      name: Weak Models AO FixedDamage — Flash cross-provider + mirror
      tracks: [1, 2, 3]
      cell_ids:
        - c02_fd_flash_ao_vs_mini_ao
        - c03_fd_flash_ao_vs_haiku_ao
        - c04_fd_flash_ao_vs_flash_ao
      publish_drop: true
    - phase_id: B3
      name: Flash vs Haiku cadence split (turn reinforced vs handshake-only)
      tracks: [4, 5]
      cell_ids:
        - c05_fd_flash_vs_haiku_ao_turn_reinforced
        - c06_fd_flash_vs_haiku_ao_handshake_only
      publish_drop: true
    - phase_id: B4
      name: Mini vs Haiku handshake-only AO
      tracks: [6]
      cell_ids:
        - c07_fd_mini_vs_haiku_ao_handshake_only
      publish_drop: true

cells:
  - id: c01_fd_mini_ao_vs_haiku_ao
    track: 1
    phase: B1
    status: complete
    question: In FixedDamage, does gpt-4o-mini AO beat claude-haiku-4.5 AO under paired side-swap?
    player_a: { model_ref: openai_weak_mini, config_ref: AO_HANDSHAKE_PLUS_TURN_FORMAT }
    player_b: { model_ref: anthropic_weak_haiku, config_ref: AO_HANDSHAKE_PLUS_TURN_FORMAT }
    pilot_matches: 24
    expansion_target_matches: 80

  - id: c02_fd_flash_ao_vs_mini_ao
    track: 1
    phase: B2
    question: In FixedDamage, does gemini-2.5-flash AO beat gpt-4o-mini AO? Can Flash execute the optimal P1 strategy against Mini?
    player_a: { model_ref: google_weak_flash, config_ref: AO_HANDSHAKE_PLUS_TURN_FORMAT }
    player_b: { model_ref: openai_weak_mini, config_ref: AO_HANDSHAKE_PLUS_TURN_FORMAT }
    pilot_matches: 24
    expansion_target_matches: 80

  - id: c03_fd_flash_ao_vs_haiku_ao
    track: 2
    phase: B2
    question: In FixedDamage, does gemini-2.5-flash AO beat claude-haiku-4.5 AO? How does Flash compare to Haiku (the stronger performer from B1)?
    player_a: { model_ref: google_weak_flash, config_ref: AO_HANDSHAKE_PLUS_TURN_FORMAT }
    player_b: { model_ref: anthropic_weak_haiku, config_ref: AO_HANDSHAKE_PLUS_TURN_FORMAT }
    pilot_matches: 24
    expansion_target_matches: 80

  - id: c04_fd_flash_ao_vs_flash_ao
    track: 3
    phase: B2
    question: In FixedDamage Flash vs Flash AO mirror match, does P1 dominance hold (~91%)? Isolates pure position effect without model-quality confound.
    player_a: { model_ref: google_weak_flash, config_ref: AO_HANDSHAKE_PLUS_TURN_FORMAT }
    player_b: { model_ref: google_weak_flash, config_ref: AO_HANDSHAKE_PLUS_TURN_FORMAT }
    pilot_matches: 24
    expansion_target_matches: 48

  - id: c05_fd_flash_vs_haiku_ao_turn_reinforced
    track: 4
    phase: B3
    question: In FixedDamage, Flash vs Haiku with ActionOnly and format reinforcement every turn.
    player_a: { model_ref: google_weak_flash, config_ref: AO_HANDSHAKE_PLUS_TURN_FORMAT }
    player_b: { model_ref: anthropic_weak_haiku, config_ref: AO_HANDSHAKE_PLUS_TURN_FORMAT }
    pilot_matches: 24
    expansion_target_matches: 80

  - id: c06_fd_flash_vs_haiku_ao_handshake_only
    track: 5
    phase: B3
    question: In FixedDamage, Flash vs Haiku with ActionOnly where format instructions are only provided in handshake (turn prompt is game view only).
    player_a: { model_ref: google_weak_flash, config_ref: AO_HANDSHAKE_ONLY_FORMAT }
    player_b: { model_ref: anthropic_weak_haiku, config_ref: AO_HANDSHAKE_ONLY_FORMAT }
    pilot_matches: 24
    expansion_target_matches: 80

  - id: c07_fd_mini_vs_haiku_ao_handshake_only
    track: 6
    phase: B4
    question: In FixedDamage, gpt-4o-mini vs Haiku with ActionOnly where format instructions are provided in handshake only (turn prompt is game view only).
    player_a: { model_ref: openai_weak_mini, config_ref: AO_HANDSHAKE_ONLY_FORMAT }
    player_b: { model_ref: anthropic_weak_haiku, config_ref: AO_HANDSHAKE_ONLY_FORMAT }
    pilot_matches: 24
    expansion_target_matches: 80
