schema_version: 1
experiment_id: 2026-03-23-variable-damage-release-1
created_at: "2026-03-23T00:00:00Z"
purpose: >-
  Baseline VariableDamage release package establishing calibration and plain
  Gemini behavior under seeded stochastic damage before any FixedDamage
  strategy-stack transfer is attempted.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_turn_variant
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first executed VariableDamage batch.

player_registry:
  attack_bot:
    kind: bot
    provider: local
    model: AttackBot
    class: AttackBot
    tier: calibration
  potion_at_80_bot:
    kind: bot
    provider: local
    model: PotionAt80Bot
    class: PotionAt80Bot
    tier: calibration
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gemini_2_5_flash:
    kind: llm
    provider: google
    model: gemini-2.5-flash
    tier: weak
    max_retries: 12
    retry_delay: 4.0
    generation_config:
      thinking_config:
        thinking_budget: 0

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: true
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"

sampling_policy:
  phase0_matches_per_cell: 24
  phase1_pilot_matches_per_cell: 24
  phase1_expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 12
    side_swap_required: true
  expansion_selection_rules:
    - risk_band_metrics_are_legible
    - baseline_position_effect_is_interpretable
    - transfer_stack_question_remains_open

execution_plan:
  preflight:
    cell_ids:
      - p0_c01_attack_vs_attack
      - p0_c02_attack_vs_potion80
    matches_per_cell: 6
    required_checks:
      - variable_damage_two_player_contract
      - rng_consumption_review
      - paired_side_swap_review
      - partial_information_public_last_action_review
      - risk_band_export_review
  phases:
    - phase_id: P0
      name: Calibration
      cell_ids:
        - p0_c01_attack_vs_attack
        - p0_c02_attack_vs_potion80
    - phase_id: P1
      name: Plain Gemini Baseline
      cell_ids:
        - p1_c01_flash_lite_ao_vs_flash_ao

cells:
  - id: p0_c01_attack_vs_attack
    phase: P0
    question: Does paired side-swap still surface position effects when attack damage is stochastic rather than fixed?
    intent: Calibrate fairness and replay legibility before LLM baseline runs.
    causal_factor: calibration_fairness
    fairness_notes: paired side-swap enabled; use this cell to estimate how much first-player advantage remains under seeded random damage
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: attack_bot
      config_ref: AO_handshake_only
      name: Attack-A
    player_b:
      player_ref: attack_bot
      config_ref: AO_handshake_only
      name: Attack-B
    matches: 24
    viewer_priority: true

  - id: p0_c02_attack_vs_potion80
    phase: P0
    question: Does VariableDamage still make a clearly weak early-heal policy visible through outcome and risk-band behavior?
    intent: Establish a simple suboptimal-policy contrast before LLM variance enters.
    causal_factor: calibration_policy_quality
    fairness_notes: paired side-swap enabled; compare policy quality and risk-band behavior, not raw topline only
    seed_offset: 100
    game:
      information_level: partial
    player_a:
      player_ref: attack_bot
      config_ref: AO_handshake_only
      name: AttackBot
    player_b:
      player_ref: potion_at_80_bot
      config_ref: AO_handshake_only
      name: PotionAt80Bot
    matches: 24
    viewer_priority: true

  - id: p1_c01_flash_lite_ao_vs_flash_ao
    phase: P1
    question: How do plain Flash-Lite and plain Flash behave in VariableDamage before any transferred strategy stack is introduced?
    intent: Establish the first model baseline for the new stochastic game class.
    causal_factor: baseline_model_gap
    fairness_notes: paired side-swap enabled; analysis must report both raw and position-controlled results, with emphasis on risk-band action splits
    seed_offset: 1000
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: AO_handshake_only
      name: FlashLite-AO
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 24
    expansion_target_matches: 48
    viewer_priority: true
