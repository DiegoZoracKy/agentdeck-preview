schema_version: 1
experiment_id: 2026-03-20-fixed-damage-mini-baseline-1
title: FixedDamage Mini Baseline 1
status: complete
question: >-
  How does plain Flash-Lite behave against plain GPT-4o Mini in FixedDamage,
  and how much of the prior cross-provider result can be explained by Mini's
  weak default policy versus the Flash-Lite strategy stack itself?
game:
  name: FixedDamageGame
  config:
    max_health: 100
    attack_damage: 20
    potion_heal: 30
    starting_potions: 3
    information_level: partial
players:
  - id: gemini_2_5_flash_lite_ao
    provider: google
    model: gemini-2.5-flash-lite
    controller: ActionOnlyController
    renderer: TextRenderer
  - id: gpt_4o_mini_ao
    provider: openai
    model: gpt-4o-mini
    controller: ActionOnlyController
    renderer: TextRenderer
variants:
  models:
    - gemini-2.5-flash-lite
    - gpt-4o-mini
  controllers:
    - ActionOnlyController
  prompt_cadence:
    - handshake_only
  prompt_overlays:
    - none
run:
  seed_base: 13242
  matches_planned: 48
  matches_completed: 48
  concurrency: 1
  max_turns: 30
  matrix_source: matrix.yaml
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  matrix_yaml: matrix.yaml
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
storage:
  raw_recordings:
    backend: local
    path: research/2026-03-20-fixed-damage-mini-baseline-1/agentdeck_runs
  summaries:
    repo_path: research/2026-03-20-fixed-damage-mini-baseline-1
  viewer_curation:
    repo_path: research/2026-03-20-fixed-damage-mini-baseline-1/artifacts
notes: >-
  This package is the missing control for Mini Parity 1. It asks whether plain
  Flash-Lite already beats plain GPT-4o Mini, or whether the dominant `41-7`
  result from Mini Parity 1 depended mainly on the Flash-Lite strategy stack.
