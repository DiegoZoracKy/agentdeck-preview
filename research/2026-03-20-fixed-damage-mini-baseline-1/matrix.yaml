schema_version: 1
experiment_id: 2026-03-20-fixed-damage-mini-baseline-1
created_at: "2026-03-20T00:00:00Z"
purpose: >-
  FixedDamage cross-provider baseline study testing how plain Flash-Lite
  performs against plain GPT-4o Mini before any Flash-Lite tuning is applied.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_action_only_turn
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first public release writeup if a frozen repo hash is required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gpt_4o_mini:
    kind: llm
    provider: openai
    model: gpt-4o-mini
    tier: weak

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: true
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"

sampling_policy:
  pilot_matches_per_cell: 48
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 24
    side_swap_required: true
  expansion_selection_rules:
    - baseline_gap_between_plain_models_is_estimated
    - mini_default_policy_pathology_is_measured_directly
    - stack_contribution_can_be_compared_against_mini_parity_1

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package is the missing baseline control for Mini Parity 1. Analysis
      must compare it directly against the tuned Flash-Lite result and separate
      Mini's default-policy weakness from Flash-Lite's strategy-stack gains.
    matches_per_cell: 0
    required_checks:
      - baseline_question_review
      - cross_provider_position_control_review
      - behavioral_endpoints_review
      - paired_side_swap_review
  phases:
    - phase_id: P1
      name: Cross-Provider Baseline Run
      cell_ids:
        - p1_c01_flash_lite_ao_vs_mini_ao

cells:
  - id: p1_c01_flash_lite_ao_vs_mini_ao
    phase: P1
    question: How does plain Flash-Lite compare to plain GPT-4o Mini at N=48 in a fresh cross-provider matchup?
    intent: Establish the untuned Flash-Lite baseline before attributing Mini Parity 1's large win to the Flash-Lite strategy stack.
    causal_factor: baseline_model_policy
    fairness_notes: paired side-swap enabled; analysis must report both named-player and position-controlled results, with special attention to second-player wins
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: AO_handshake_only
      name: FlashLite-AO
    player_b:
      player_ref: gpt_4o_mini
      config_ref: AO_handshake_only
      name: Mini-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true
