schema_version: 1
experiment_id: 2026-03-20-fixed-damage-threshold-1
title: FixedDamage Threshold 1
status: complete
question: >-
  Does HP-threshold grounding on top of turn-reinforced ReasoningController
  reduce Flash-Lite's residual second-player hesitation against plain Gemini
  Flash in FixedDamage, and are any gains worth the added cost and latency?
game:
  name: FixedDamageGame
  config:
    max_health: 100
    attack_damage: 20
    potion_heal: 30
    starting_potions: 3
    information_level: partial
players:
  - id: gemini_2_5_flash_lite_rc_tr
    provider: google
    model: gemini-2.5-flash-lite
    controller: ReasoningController
    renderer: TextRenderer
  - id: gemini_2_5_flash_lite_rc_tr_hp
    provider: google
    model: gemini-2.5-flash-lite
    controller: ReasoningController
    renderer: TextRenderer
  - id: gemini_2_5_flash_ao
    provider: google
    model: gemini-2.5-flash
    controller: ActionOnlyController
    renderer: TextRenderer
variants:
  models:
    - gemini-2.5-flash-lite
    - gemini-2.5-flash
  controllers:
    - ReasoningController
    - ActionOnlyController
  prompt_cadence:
    - turn_reinforced
  prompt_overlays:
    - none
    - hp_threshold_grounding
run:
  seed_base: 8242
  matches_planned: 48
  matches_completed: 48
  concurrency: 1
  max_turns: 30
  matrix_source: matrix.yaml
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  matrix_yaml: matrix.yaml
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
storage:
  raw_recordings:
    backend: local
    path: research/2026-03-20-fixed-damage-threshold-1/agentdeck_runs
  summaries:
    repo_path: research/2026-03-20-fixed-damage-threshold-1
  viewer_curation:
    repo_path: research/2026-03-20-fixed-damage-threshold-1/artifacts
notes: >-
  This package follows FixedDamage Parity 2. It keeps the same cross-model
  matchup and turn-reinforced reasoning baseline, but tests a narrower
  mechanism hypothesis: whether an HP-threshold grounding instruction fixes the
  residual second-player hesitation that remained after turn reinforcement. The
  pilot completed at N=24 per cell and found a strong mechanism win: seat-
  conditioned threshold asymmetry largely disappeared, while the competitive
  outcome narrowed to a near draw but remained statistically null.
