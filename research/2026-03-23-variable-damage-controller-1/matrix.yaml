schema_version: 1
experiment_id: 2026-03-23-variable-damage-controller-1
created_at: "2026-03-23T00:00:00Z"
purpose: >-
  VariableDamage controller-intervention pilot comparing ActionOnlyController
  and ReasoningController on the two models that remain plausible RC
  candidates after the VariableDamage AO baselines: Gemini Flash-Lite and
  GPT-4o Mini.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_handshake_only_turns
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first public VariableDamage controller writeup if required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gpt_4o_mini:
    kind: llm
    provider: openai
    model: gpt-4o-mini
    tier: weak

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"

sampling_policy:
  pilot_matches_per_cell: 24
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 12
    side_swap_required: true
  expansion_selection_rules:
    - behavioral_delta_is_legible_under_uncertainty
    - outcome_delta_is_directionally_interesting
    - rc_is_worth_testing_before_turn_overlays

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package tests controller intervention only. It should be read as a
      within-model policy-improvement probe, not as a cross-model parity claim.
    matches_per_cell: 0
    required_checks:
      - reasoning_controller_format_review
      - variable_damage_risk_band_review
      - paired_side_swap_review
      - openai_vs_gemini_controller_scope_review
  phases:
    - phase_id: P1
      name: Controller Pilot
      cell_ids:
        - p1_c01_flash_lite_ao_vs_rc
        - p1_c02_mini_ao_vs_rc

cells:
  - id: p1_c01_flash_lite_ao_vs_rc
    phase: P1
    question: Does requiring explicit reasoning improve Gemini Flash-Lite decision quality in VariableDamage?
    intent: Compare controller type while holding model, game, fairness, and turn cadence fixed.
    causal_factor: controller_type
    fairness_notes: paired side-swap enabled; compare risk-band behavior before topline win-rate claims
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: AO_handshake_only
      name: FlashLite-AO
    player_b:
      player_ref: gemini_2_5_flash_lite
      config_ref: RC_handshake_only
      name: FlashLite-RC
    matches: 24
    pilot_matches: 24
    expansion_target_matches: 48
    viewer_priority: true

  - id: p1_c02_mini_ao_vs_rc
    phase: P1
    question: Does requiring explicit reasoning improve GPT-4o Mini decision quality in VariableDamage?
    intent: Compare controller type while holding model, game, fairness, and turn cadence fixed.
    causal_factor: controller_type
    fairness_notes: paired side-swap enabled; compare risk-band behavior before topline win-rate claims
    seed_offset: 100
    game:
      information_level: partial
    player_a:
      player_ref: gpt_4o_mini
      config_ref: AO_handshake_only
      name: Mini-AO
    player_b:
      player_ref: gpt_4o_mini
      config_ref: RC_handshake_only
      name: Mini-RC
    matches: 24
    pilot_matches: 24
    expansion_target_matches: 48
    viewer_priority: true
