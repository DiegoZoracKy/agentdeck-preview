schema_version: 1
experiment_id: 2026-03-23-variable-damage-controller-1
title: VariableDamage Controller 1
status: complete
question: >-
  Does requiring explicit reasoning improve VariableDamage decision quality for
  the models that still look plausibly improvable after the AO baseline sweep:
  Gemini Flash-Lite and GPT-4o Mini?
game:
  name: VariableDamageGame
  config:
    max_health: 100
    min_attack_damage: 15
    max_attack_damage: 25
    potion_heal: 30
    starting_potions: 3
    information_level: partial
players:
  - id: gemini_2_5_flash_lite_ao
    provider: google
    model: gemini-2.5-flash-lite
    controller: ActionOnlyController
    renderer: TextRenderer
  - id: gemini_2_5_flash_lite_rc
    provider: google
    model: gemini-2.5-flash-lite
    controller: ReasoningController
    renderer: TextRenderer
  - id: gpt_4o_mini_ao
    provider: openai
    model: gpt-4o-mini
    controller: ActionOnlyController
    renderer: TextRenderer
  - id: gpt_4o_mini_rc
    provider: openai
    model: gpt-4o-mini
    controller: ReasoningController
    renderer: TextRenderer
variants:
  models:
    - gemini-2.5-flash-lite
    - gpt-4o-mini
  controllers:
    - ActionOnlyController
    - ReasoningController
  prompt_cadence:
    - handshake_only
run:
  seed_base: 23242
  matches_planned: 48
  matches_completed: 48
  concurrency: 1
  max_turns: 40
  matrix_source: matrix.yaml
analysis_plan:
  ci_method: wilson
  alpha: 0.05
  effect_size: cohens_h
artifacts:
  matrix_yaml: matrix.yaml
  results_json: results.json
  results_csv: results.csv
  analysis_md: analysis.md
storage:
  raw_recordings:
    backend: local
    path: research/2026-03-23-variable-damage-controller-1/agentdeck_runs
  summaries:
    repo_path: research/2026-03-23-variable-damage-controller-1
  viewer_curation:
    repo_path: research/2026-03-23-variable-damage-controller-1/artifacts
notes: >-
  First VariableDamage controller-intervention package. It follows the AO
  baseline sweep by testing ReasoningController only on the models that still
  look plausibly improvable in this game class: Flash-Lite and GPT-4o Mini.
