schema_version: 1
experiment_id: 2026-03-25-variable-damage-parity-1
created_at: "2026-03-25T00:00:00Z"
purpose: >-
  VariableDamage parity expansion testing whether the Threshold 1
  risk-grounded Flash-Lite treatment remains competitive with plain Flash at
  `N=48`.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_variable_risk_turn_modes
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before public citation if required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gemini_2_5_flash:
    kind: llm
    provider: google
    model: gemini-2.5-flash
    tier: weak
    max_retries: 12
    retry_delay: 4.0
    generation_config:
      thinking_config:
        thinking_budget: 0

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_risk_grounded:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: |-
        {game_view}

        {controller_format}

        Before acting, check your risk band carefully.
        - If your HP is above 55, do not use POTION.
        - If your HP is 25 or lower and you have potions, use POTION.
        - If your HP is 26 to 40 and you have 2 or 3 potions, prefer POTION now rather than entering the lethal zone with fewer resources.
        - If your HP is 25 or lower and you have no potions, ATTACK anyway.
        - Otherwise, act on your best read of the state.

sampling_policy:
  pilot_matches_per_cell: 48
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 24
    side_swap_required: true
  expansion_selection_rules:
    - parity_result_should_be_read_with_first_lethal_entry_inventory_and_position_split_together
    - risk_grounded_condition_should_remain_the_carry_forward_flash_lite_line_only_if_behavior_holds_up_at_N48

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This is a single-cell parity expansion. The main question is whether the
      Threshold 1 treatment remains near parity or better at `N=48`, with
      first-lethal-entry inventory, seat stability, and risk-band timing
      carrying as much interpretive weight as the final win count.
    matches_per_cell: 0
    required_checks:
      - threshold1_carry_forward_review
      - paired_side_swap_review
      - flash_retry_review
      - first_lethal_entry_inventory_review
      - parity_cost_review
  phases:
    - phase_id: P1
      name: Flash-Lite Risk-Grounded Parity Expansion
      cell_ids:
        - p1_c01_flash_lite_rc_risk_vs_flash_ao

cells:
  - id: p1_c01_flash_lite_rc_risk_vs_flash_ao
    phase: P1
    question: Does the Threshold 1 risk-grounded Flash-Lite condition remain competitive with plain Flash at `N=48`?
    intent: Expand the strongest current Flash-Lite VariableDamage treatment rather than branching to a new intervention.
    causal_factor: strategy_stack
    fairness_notes: paired side-swap enabled; interpret with first-lethal-entry inventory, risk-band timing, and seat-controlled splits
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: RC_risk_grounded
      name: FlashLite-RC-RISK
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 48
    pilot_matches: 48
    viewer_priority: true
