schema_version: 1
experiment_id: 2026-03-25-variable-damage-threshold-1
created_at: "2026-03-25T00:00:00Z"
purpose: >-
  VariableDamage mechanism follow-up testing whether a risk-band-aware HP
  instruction on top of Flash-Lite reasoning can reduce the remaining
  safe-zone over-healing and empty-at-lethal failures against plain Flash.

frozen_inputs:
  git_tag: null
  git_commit: null
  prompt_template_version: game_default_handshake_plus_variable_risk_turn_modes
  pricing_snapshot: src/agentdeck/config/pricing.yaml
  note: Fill git_commit before the first public VariableDamage threshold writeup if required.

player_registry:
  gemini_2_5_flash_lite:
    kind: llm
    provider: google
    model: gemini-2.5-flash-lite
    tier: weak
    generation_config:
      thinking_config:
        thinking_budget: 0
  gemini_2_5_flash:
    kind: llm
    provider: google
    model: gemini-2.5-flash
    tier: weak
    max_retries: 12
    retry_delay: 4.0
    generation_config:
      thinking_config:
        thinking_budget: 0

config_registry:
  AO_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ActionOnlyController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_handshake_only:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: "{game_view}"
  RC_risk_grounded:
    pairing_policy: paired_side_swap
    first_player_policy: random
    controller: ReasoningController
    conclusion:
      enabled: false
    prompt_builder:
      turn_template_mode: custom
      turn_template: |-
        {game_view}

        {controller_format}

        Before acting, check your risk band carefully.
        - If your HP is above 55, do not use POTION.
        - If your HP is 25 or lower and you have potions, use POTION.
        - If your HP is 26 to 40 and you have 2 or 3 potions, prefer POTION now rather than entering the lethal zone with fewer resources.
        - If your HP is 25 or lower and you have no potions, ATTACK anyway.
        - Otherwise, act on your best read of the state.

sampling_policy:
  pilot_matches_per_cell: 24
  expansion_target_matches_per_selected_cell: 48
  paired_seed_side_swap:
    enabled: true
    seed_pairs_per_cell: 12
    side_swap_required: true
  expansion_selection_rules:
    - risk_instruction_reduces_zero_potions_on_first_lethal_entry
    - risk_instruction_improves_lower_danger_and_lethal_healing_without_safe_zone_regression
    - risk_instruction_preserves_or_improves_flash_lite_competitiveness_against_flash

execution_plan:
  preflight:
    cell_ids: []
    interpretation: >-
      This package is the first VariableDamage prompt-layer probe on the
      Flash-Lite RC line. Read the control and treatment together, with
      first-lethal-entry inventory, lower-danger healing, lethal-zone
      discipline, and second-player conversion carrying more weight than the
      raw pilot win count by itself.
    matches_per_cell: 0
    required_checks:
      - variable_damage_threshold_scope_review
      - flash_lite_rc_failure_mode_review
      - paired_side_swap_review
      - first_lethal_entry_inventory_review
      - risk_band_subband_review
  phases:
    - phase_id: P1
      name: Risk-Instruction Pilot
      cell_ids:
        - p1_c01_flash_lite_rc_vs_flash_ao
        - p1_c02_flash_lite_rc_risk_vs_flash_ao

cells:
  - id: p1_c01_flash_lite_rc_vs_flash_ao
    phase: P1
    question: Does the Flash-Lite RC baseline still show the same VariableDamage inventory and seat-conditioned failures against plain Flash on a fresh seed family?
    intent: Refresh the RC control arm inside the same package before testing the risk-grounded instruction.
    causal_factor: strategy_stack
    fairness_notes: paired side-swap enabled; compare first-lethal-entry inventory and seat-controlled risk behavior before topline claims
    seed_offset: 0
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: RC_handshake_only
      name: FlashLite-RC
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 24
    pilot_matches: 24
    expansion_target_matches: 48
    viewer_priority: true

  - id: p1_c02_flash_lite_rc_risk_vs_flash_ao
    phase: P1
    question: Does a risk-band-aware HP instruction reduce safe-zone waste and empty-at-lethal entries enough to improve Flash-Lite's RC matchup against plain Flash?
    intent: Test whether explicit VariableDamage risk thresholds outperform plain RC without the failed turn-reinforcement layer.
    causal_factor: risk_instruction
    fairness_notes: paired side-swap enabled; compare safe-zone, lower-danger, lethal, scarcity, and second-player behavior before topline claims
    seed_offset: 100
    game:
      information_level: partial
    player_a:
      player_ref: gemini_2_5_flash_lite
      config_ref: RC_risk_grounded
      name: FlashLite-RC-RISK
    player_b:
      player_ref: gemini_2_5_flash
      config_ref: AO_handshake_only
      name: Flash-AO
    matches: 24
    pilot_matches: 24
    expansion_target_matches: 48
    viewer_priority: true
