schema_version: 1
study:
  id: 2026-04-27-agentic-edge-strategy-stack
  title: "The Agentic Edge: Strategy Stack Effects on LLM Agency"
  question: >-
    Can strategy stacks change LLM agent behavior enough to overcome model-tier
    differences in sequential decision environments?
  intent: confirmatory
  hypotheses:
    - id: h1
      statement: Strategy scaffolding changes behavior within the same model.
    - id: h2
      statement: >-
        A scaffolded lower-tier model can overcome an unscaffolded higher-tier
        model in FixedDamage.
    - id: h3
      statement: The strategy effect transfers imperfectly to stochastic VariableDamage.
execution_groups:
  - id: p0
    phase: p0
    entrypoint: assembly_p0.py
    artifacts: &assembly_artifacts
      - assembly_common.py
      - matrix.yaml
      - manifest.yaml
      - prompts/handshake_default.txt
      - prompts/turn_action_only.txt
      - prompts/turn_fixed_full_stack.txt
      - prompts/turn_reasoning.txt
      - prompts/turn_variable_full_stack.txt
  - id: p1
    phase: p1
    entrypoint: assembly_p1.py
    artifacts: *assembly_artifacts
  - id: p2
    phase: p2
    entrypoint: assembly_p2.py
    artifacts: *assembly_artifacts
  - id: p3
    phase: p3
    entrypoint: assembly_p3.py
    artifacts: *assembly_artifacts
phases:
  - {id: p0, kind: preflight}
  - {id: p1, kind: pilot}
  - {id: p2, kind: study}
  - {id: p3, kind: supplemental}
conditions:
