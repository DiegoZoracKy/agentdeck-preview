  - {id: potion80-bot-s0-ao, description: "potion80_bot under S0_AO."}
  - {id: flashlite-s0-ao, description: "flashlite under S0_AO."}
  - {id: gpt4omini-s0-ao, description: "gpt4omini under S0_AO."}
  - {id: flashlite-s1-rc, description: "flashlite under S1_RC."}
  - {id: flashlite-s3-fixed-full, description: "flashlite under S3_FIXED_FULL."}
  - {id: flashlite-s3-variable-full, description: "flashlite under S3_VARIABLE_FULL."}
