  # ── P3: Targeted ladder completion ───────────────────────────────────────
  # S1 cross-tier cell: fills the tuning-ladder step between
  # S0 (0/48) and S3 (38/48) for FlashLite vs GPT4oMini in FixedDamage.
  # phase_model.study_phases includes P3 so the package aggregate tells the full
  # FixedDamage S0 → S1 → S3 tuning arc.

  - id: p3_fd_frontier_s1
    track: fixed_damage
    phase: P3
    question: Can ReasoningController-only Flash-Lite beat unscaffolded GPT-4o-mini in FixedDamage?
