name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=src/agentdeck --cov-report=xml --cov-report=term --cov-fail-under=75

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Black (format check)
        run: |
          black --check src/ tests/

      - name: Run Pylint
        run: |
          pylint src/agentdeck --fail-under=9.0

      - name: Run mypy (type check)
        run: |
          # Note: 120+ type errors still exist in v0.1.1 (technical debt)
          # Errors are displayed but don't block CI for preview release
          # Goal: Fix incrementally in v0.1.x releases
          mypy src/agentdeck --no-error-summary --no-pretty || true

  dependency-check:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify core install works
        run: |
          python -c "import agentdeck; print(f'AgentDeck v{agentdeck.__version__} imported successfully')"

      - name: Install dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run basic smoke tests
        run: |
          python -c "from agentdeck import ActionOnlyController, TextRenderer; print('Core imports OK')"
