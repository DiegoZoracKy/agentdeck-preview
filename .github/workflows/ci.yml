name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=src/agentdeck --cov-report=xml --cov-report=term --cov-fail-under=75

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Black (format check)
        run: |
          black --check src/ tests/

      - name: Run Pylint
        run: |
          pylint src/agentdeck --fail-under=9.0

      - name: Strict-check the external authoring boundary
        run: |
          mypy --strict --follow-imports=silent tests/fixtures/instruments/number_duel/number_duel

      - name: Run Bandit (medium/high severity, medium/high confidence)
        run: |
          bandit -r src/agentdeck -ll -ii -q

  dependency-check:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Audit declared runtime dependencies
        run: |
          pip-audit --strict --progress-spinner off --disable-pip --no-deps \
            --requirement requirements/runtime.txt
