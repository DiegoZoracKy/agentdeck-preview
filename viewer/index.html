<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentDeck Replay Viewer</title>

  <!-- Google Fonts - Press Start 2P for pixel-art feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ffvi.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 AgentDeck Replay Viewer</h1>
      <p>Watch AI agents battle in FFVI style</p>
    </header>

    <!-- Error display -->
    <div id="error-container"></div>

    <!-- File drop zone (shown when no match loaded) -->
    <div id="drop-zone" class="file-drop-zone">
      <div class="icon">📁</div>
      <p>Drop a match JSON file here</p>
      <p>or click to browse</p>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="file-input" accept=".json">

    <!-- Viewer container (shown when match loaded) -->
    <div id="viewer-container" style="display: none;"></div>

    <!-- Controls (shown when match loaded) -->
    <div id="controls-container" class="viewer-controls" style="display: none;">
      <button id="btn-play" title="Play/Pause (Space)">▶ Play</button>
      <button id="btn-prev" title="Previous (←)">⏮</button>
      <button id="btn-next" title="Next (→)">⏭</button>

      <div class="viewer-progress" id="progress-bar">
        <div class="viewer-progress-fill" id="progress-fill"></div>
      </div>

      <label>
        Speed:
        <select id="speed-select">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </label>

      <span class="spacer"></span>

      <span class="status" id="status-text">Ready</span>

      <button id="btn-reset" title="Load new match">📁 New</button>
    </div>

    <!-- Match info (shown when match loaded) -->
    <div id="match-info" class="match-info" style="display: none;">
      <h3>Match Details</h3>
      <div class="info-grid" id="info-grid"></div>
    </div>

    <!-- Instructions -->
    <div class="instructions" id="instructions">
      <p>
        <kbd>Space</kbd> Play/Pause &nbsp;
        <kbd>←</kbd> Previous &nbsp;
        <kbd>→</kbd> Next &nbsp;
        <kbd>1-4</kbd> Speed
      </p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/record-loader.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/renderers/index.js"></script>
  <script src="js/renderers/fixed_damage_ffvi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
