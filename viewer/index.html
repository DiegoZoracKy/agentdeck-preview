<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentDeck Replay Viewer</title>

  <!-- Google Fonts - Press Start 2P for pixel-art feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/ffvi.css">

  <style>
    /* Page Layout */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      color: #fff;
    }

    header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      margin: 0 0 8px 0;
      text-shadow: 2px 2px 0 #000;
    }

    header p {
      font-size: 14px;
      color: #aaa;
      margin: 0;
    }

    /* Viewer Container */
    #viewer-container {
      margin-bottom: 12px;
    }

    /* Error Display */
    .error-message {
      background: #441111;
      border: 2px solid #ff4444;
      border-radius: 8px;
      padding: 16px;
      color: #ff8888;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      margin-bottom: 16px;
    }

    /* Hidden file input */
    #file-input {
      display: none;
    }

    /* Instructions */
    .instructions {
      color: #888;
      font-size: 12px;
      text-align: center;
      margin-top: 20px;
    }

    .instructions kbd {
      background: #333;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 2px 6px;
      font-family: monospace;
    }

    /* Match Info */
    .match-info {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      color: #aaa;
      font-size: 12px;
    }

    .match-info h3 {
      margin: 0 0 8px 0;
      color: #fff;
      font-size: 14px;
    }

    .match-info .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .match-info .info-item {
      display: flex;
      gap: 8px;
    }

    .match-info .info-label {
      color: #666;
    }

    .match-info .info-value {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 AgentDeck Replay Viewer</h1>
      <p>Watch AI agents battle in FFVI style</p>
    </header>

    <!-- Error display -->
    <div id="error-container"></div>

    <!-- File drop zone (shown when no match loaded) -->
    <div id="drop-zone" class="file-drop-zone">
      <div class="icon">📁</div>
      <p>Drop a match JSON file here</p>
      <p>or click to browse</p>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="file-input" accept=".json">

    <!-- Viewer container (shown when match loaded) -->
    <div id="viewer-container" style="display: none;"></div>

    <!-- Controls (shown when match loaded) -->
    <div id="controls-container" class="viewer-controls" style="display: none;">
      <button id="btn-play" title="Play/Pause (Space)">▶ Play</button>
      <button id="btn-prev" title="Previous (←)">⏮</button>
      <button id="btn-next" title="Next (→)">⏭</button>

      <div class="viewer-progress" id="progress-bar">
        <div class="viewer-progress-fill" id="progress-fill"></div>
      </div>

      <label>
        Speed:
        <select id="speed-select">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </label>

      <span class="spacer"></span>

      <span class="status" id="status-text">Ready</span>

      <button id="btn-reset" title="Load new match">📁 New</button>
    </div>

    <!-- Match info (shown when match loaded) -->
    <div id="match-info" class="match-info" style="display: none;">
      <h3>Match Details</h3>
      <div class="info-grid" id="info-grid"></div>
    </div>

    <!-- Instructions -->
    <div class="instructions" id="instructions">
      <p>
        <kbd>Space</kbd> Play/Pause &nbsp;
        <kbd>←</kbd> Previous &nbsp;
        <kbd>→</kbd> Next &nbsp;
        <kbd>1-4</kbd> Speed
      </p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/record-loader.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/renderers/ffvi.js"></script>

  <script>
    // =========================================================================
    // Application State
    // =========================================================================

    let timeline = null;
    let renderer = null;
    let matchData = null;

    // DOM Elements
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const viewerContainer = document.getElementById('viewer-container');
    const controlsContainer = document.getElementById('controls-container');
    const matchInfoContainer = document.getElementById('match-info');
    const errorContainer = document.getElementById('error-container');
    const instructionsContainer = document.getElementById('instructions');

    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnReset = document.getElementById('btn-reset');
    const speedSelect = document.getElementById('speed-select');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const statusText = document.getElementById('status-text');
    const infoGrid = document.getElementById('info-grid');

    // =========================================================================
    // File Loading
    // =========================================================================

    function showError(message) {
      errorContainer.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
    }

    function clearError() {
      errorContainer.innerHTML = '';
    }

    async function loadMatchFile(file) {
      clearError();

      try {
        matchData = await RecordLoader.loadFromFile(file);
        initializeViewer(matchData);
      } catch (err) {
        showError(err.message);
        console.error('Load error:', err);
      }
    }

    function initializeViewer(data) {
      // Hide drop zone, show viewer
      dropZone.style.display = 'none';
      viewerContainer.style.display = 'block';
      controlsContainer.style.display = 'flex';
      matchInfoContainer.style.display = 'block';

      // Create timeline
      timeline = new Timeline(data);

      // Create renderer
      renderer = new FFVIRenderer();
      renderer.init(viewerContainer, data);

      // Connect timeline to renderer
      timeline.onFrame(frame => {
        renderer.renderFrame(frame);
        updateProgress();
      });

      timeline.onEnd(winner => {
        renderer.renderVictory(winner, data.finalState, {
          outcome: data.outcome,
          forfeitReason: data.forfeitReason,
          forfeitingPlayer: data.forfeitingPlayer
        });
        btnPlay.textContent = '↺ Replay';
        updateStatus('Match Complete');
      });

      timeline.onStateChange(() => {
        updateControls();
        updateProgress();
      });

      // Show match info
      displayMatchInfo(data);

      // Initial state - don't auto-play, just show "ready" state
      updateControls();
      updateProgress();
      updateStatus(`Loaded: ${data.matchId} - Press Play to start`);
    }

    function resetViewer() {
      // Cleanup
      if (renderer) {
        renderer.destroy();
        renderer = null;
      }
      timeline = null;
      matchData = null;

      // Reset UI
      viewerContainer.style.display = 'none';
      viewerContainer.innerHTML = '';
      controlsContainer.style.display = 'none';
      matchInfoContainer.style.display = 'none';
      dropZone.style.display = 'block';

      clearError();
    }

    function displayMatchInfo(data) {
      const items = [
        { label: 'Match ID', value: data.matchId },
        { label: 'Game', value: data.game },
        { label: 'Players', value: data.players.join(' vs ') },
        { label: 'Winner', value: data.winner || 'Draw' },
        { label: 'Turns', value: data.frames.length },
        { label: 'Seed', value: data.seed },
      ];

      infoGrid.innerHTML = items.map(item => `
        <div class="info-item">
          <span class="info-label">${item.label}:</span>
          <span class="info-value">${item.value}</span>
        </div>
      `).join('');
    }

    // =========================================================================
    // Controls
    // =========================================================================

    function updateControls() {
      if (!timeline) return;

      if (timeline.isPlaying) {
        btnPlay.textContent = '⏸ Pause';
      } else if (timeline.currentFrame >= timeline.totalFrames - 1) {
        btnPlay.textContent = '↺ Replay';
      } else {
        btnPlay.textContent = '▶ Play';
      }

      // Disable prev if at start (frame -1 or 0)
      btnPrev.disabled = timeline.currentFrame <= 0;
      // Disable next if at end
      btnNext.disabled = timeline.currentFrame >= timeline.totalFrames - 1;
    }

    function updateProgress() {
      if (!timeline || timeline.totalFrames === 0 || timeline.currentFrame < 0) {
        progressFill.style.width = '0%';
        return;
      }

      const progress = ((timeline.currentFrame + 1) / timeline.totalFrames) * 100;
      progressFill.style.width = `${progress}%`;
    }

    function updateStatus(text) {
      statusText.textContent = text;
    }

    // Button handlers
    btnPlay.addEventListener('click', () => {
      if (!timeline) return;

      if (timeline.isPlaying) {
        timeline.pause();
      } else {
        timeline.play();
        updateStatus('Playing...');
      }
    });

    btnPrev.addEventListener('click', () => {
      if (timeline) timeline.step(-1);
    });

    btnNext.addEventListener('click', () => {
      if (timeline) timeline.step(1);
    });

    btnReset.addEventListener('click', resetViewer);

    speedSelect.addEventListener('change', (e) => {
      if (timeline) {
        timeline.setSpeed(parseFloat(e.target.value));
      }
    });

    // Progress bar click to seek
    progressBar.addEventListener('click', (e) => {
      if (!timeline || timeline.totalFrames === 0) return;

      const rect = progressBar.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      const frameIndex = Math.floor(percent * timeline.totalFrames);
      timeline.seek(frameIndex);
    });

    // =========================================================================
    // Drag & Drop
    // =========================================================================

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');

      const file = e.dataTransfer.files[0];
      if (file && file.name.endsWith('.json')) {
        loadMatchFile(file);
      } else {
        showError('Please drop a JSON file');
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        loadMatchFile(file);
      }
    });

    // =========================================================================
    // Keyboard Controls
    // =========================================================================

    document.addEventListener('keydown', (e) => {
      // Don't capture when typing in inputs
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      switch (e.code) {
        case 'Space':
          e.preventDefault();
          btnPlay.click();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          if (timeline) timeline.step(-1);
          break;
        case 'ArrowRight':
          e.preventDefault();
          if (timeline) timeline.step(1);
          break;
        case 'Digit1':
          speedSelect.value = '0.5';
          if (timeline) timeline.setSpeed(0.5);
          break;
        case 'Digit2':
          speedSelect.value = '1';
          if (timeline) timeline.setSpeed(1);
          break;
        case 'Digit3':
          speedSelect.value = '2';
          if (timeline) timeline.setSpeed(2);
          break;
        case 'Digit4':
          speedSelect.value = '4';
          if (timeline) timeline.setSpeed(4);
          break;
        case 'KeyR':
          if (e.ctrlKey || e.metaKey) return; // Don't capture browser refresh
          resetViewer();
          break;
      }
    });

    // =========================================================================
    // URL Parameter Support
    // =========================================================================

    async function loadFromUrl(url) {
      clearError();
      updateStatus('Loading from URL...');

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Failed to fetch: ${response.status}`);
        }
        const json = await response.json();
        matchData = RecordLoader.load(json);
        initializeViewer(matchData);
      } catch (err) {
        showError(`Failed to load from URL: ${err.message}`);
        console.error('URL load error:', err);
      }
    }

    // Check for ?match= URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const matchUrl = urlParams.get('match');
    if (matchUrl) {
      loadFromUrl(matchUrl);
    }
  </script>
</body>
</html>
