[pytest]
# Pytest configuration for AgentDeck spec-driven test suite

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Coverage
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=src/agentdeck
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated, mocked external deps)
    integration: Integration tests (multi-component interactions)
    e2e: End-to-end tests (live APIs, require keys, manual)
    slow: Slow tests (> 1s runtime)
    spec_observability: SPEC-OBSERVABILITY tests
    spec_game: SPEC-GAME tests
    spec_controller: SPEC-CONTROLLER tests
    spec_renderer: SPEC-RENDERER tests
    spec_prompt_builder: SPEC-PROMPT-BUILDER tests
    spec_player: SPEC-PLAYER tests
    spec_console: SPEC-CONSOLE tests
    spec_turn_loop: SPEC-GAME-MECHANIC-TURN-BASED tests
    spec_recorder: SPEC-RECORDER tests
    spec_replay: SPEC-REPLAY tests
    spec_spectator: SPEC-SPECTATOR tests
    spec_pricing: SPEC-PRICING tests
    spec_research: SPEC-RESEARCH tests
    spec_llm: SPEC-LLM tests
    spec_agentdeck: SPEC-AGENTDECK tests

# Coverage thresholds (fail if below)
[coverage:run]
source = src/agentdeck
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
fail_under = 75
precision = 2
show_missing = True
skip_covered = False

# Exclude from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    if TYPE_CHECKING:
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    @abstractmethod
    @abc.abstractmethod
