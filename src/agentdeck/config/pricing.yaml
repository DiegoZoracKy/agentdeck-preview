# ============================================================================
# Google Gemini Models
# Source: https://ai.google.dev/gemini-api/docs/pricing
#
# Notes:
# - This section tracks the standard text-token rates used by AgentDeck's
#   current token-based cost calculator.
# - Modality-specific (audio/image/video) and per-image/per-second pricing are
#   documented under _pricing_modifiers and not yet applied automatically.
# ============================================================================
google:
  _pricing_modifiers:
    updated_at: "2026-02-13"
    batch_discount_multiplier: 0.5
    long_context_threshold_input_tokens: 200000
    references:
      - "Some models have higher rates for prompts >200k input tokens."
      - "Some models use modality-specific rates (text/image/video vs audio)."
      - "Grounding and other tool charges are additive and model-dependent."

